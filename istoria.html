<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Κουίζ Ιστορίας · Μαθήματα 5-12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Commissioner:wght@400;500;600;700;800&display=swap">
<style>
/* Ίδια εμφάνιση με το κουίζ Φυσικών: μία κάρτα τη φορά, μεγάλα γράμματα και κουμπιά για παιδί 10-11 χρονών.
   Κάθε μάθημα έχει το χρώμα του (--c). Ένα φωτεινό στυλ, χωρίς σκοτεινό θέμα. */
:root{
  --bg:#f4f2fb;
  --card:#ffffff;
  --soft:#f1eef9;
  --line:#ddd6ee;
  --fg:#221d33;
  --muted:#5f5875;
  --brand:#7a4cd9;
  --brand-soft:#efe8ff;
  --good:#1f9e5a; --good-soft:#dff5e8;
  --bad:#d93a2b;  --bad-soft:#fde5e2;
  --mid:#d98a00;  --mid-soft:#fff1d6;
  --c:#7a4cd9; --c-soft:#efe8ff;
  --f-display:"Comfortaa","Commissioner",system-ui,sans-serif;
  --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:21px;line-height:1.2}
p{margin:6px 0}
a{color:var(--brand)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{font-family:var(--f-display);font-weight:700;color:var(--brand);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 12px rgba(34,29,51,.06)}
.stack{display:flex;flex-direction:column;gap:14px}
.gap{height:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.btn{appearance:none;border:2px solid transparent;background:var(--c);color:#fff;font:700 18px var(--f-body);padding:12px 20px;border-radius:14px;cursor:pointer;min-height:52px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--card);color:var(--fg);border-color:var(--line)}
.btn.sm{font-size:15px;min-height:42px;padding:8px 14px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn:focus-visible,.opt:focus-visible,.chipbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.modes button:focus-visible,.eqc:focus-visible,.lbtn:focus-visible{outline:3px solid #2d7ff9;outline-offset:2px}
.hintline{font-size:15px;color:var(--muted)}
.hello{font-size:19px}
.foot{text-align:center;margin-top:18px;font-size:16px}

/* αρχική */
.modes{display:grid;gap:12px}
.modes button{appearance:none;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:44px 1fr;column-gap:12px;align-items:center;color:var(--fg)}
.modes button:hover{border-color:var(--brand)}
.modes .ic{grid-row:span 2;font-size:32px;line-height:1}
.modes b{font-family:var(--f-display);font-size:19px}
.modes small{font-size:15px;color:var(--muted);line-height:1.35}

/* πρόοδος */
.prog{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--c-soft);color:var(--c)}
.stars{font-size:18px;letter-spacing:1px;white-space:nowrap}

/* ερώτηση */
.qline{display:flex;gap:10px;align-items:flex-start}
.qline .qtext,.qline .eqq{flex:1}
.qtext{font-size:21px;font-weight:600;line-height:1.4;margin:4px 0}
.qtext.sm{font-size:18px}
.eqbox{background:var(--c-soft);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px}
.eqq{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.35;margin:0}
blockquote.stmt{margin:4px 0;padding:10px 14px;border-left:5px solid var(--c);background:var(--soft);border-radius:10px;font-size:19px;font-weight:600}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{appearance:none;text-align:left;border:2px solid var(--line);background:#fff;color:var(--fg);font:600 18px var(--f-body);padding:12px 14px;border-radius:14px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:54px;line-height:1.35}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);font-size:16px}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.sel{border-color:var(--c);background:var(--c-soft)}
.opt.sel b{background:var(--c);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-style:dashed;border-color:var(--good)}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:20px}
.matchrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.matchrow .k{font-weight:700}
.matchrow.ok select{border-color:var(--good);background:var(--good-soft)}
.matchrow.no select{border-color:var(--bad);background:var(--bad-soft)}
select,input[type=text],textarea{font:600 17px var(--f-body);padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--fg);min-height:48px;max-width:100%}
select{width:100%}
textarea{width:100%;font-weight:500;line-height:1.5;resize:vertical}
.note2{font-size:15px;color:var(--muted)}
.fix{display:block;font-size:15px;color:var(--good);font-weight:700;margin-top:4px}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--soft);border-radius:12px}
.bank span{background:#fff;border:2px solid var(--c);border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px}
ol.sents{padding-left:24px;margin:4px 0;display:grid;gap:10px}
ol.sents li{line-height:2.1}
ol.sents select{width:auto;min-width:130px;display:inline-block;padding:4px 8px;min-height:40px;font-size:16px}
select.ok,input.ok{border-color:var(--good);background:var(--good-soft)}
select.no,input.no{border-color:var(--bad);background:var(--bad-soft)}
.ctext{font-size:19px;line-height:2.3}
.ctext input{display:inline-block;min-height:40px;padding:4px 8px;font-size:17px;max-width:100%}
.pool,.seq{display:flex;flex-direction:column;gap:8px;min-height:56px;padding:8px;border-radius:14px}
.pool{background:var(--soft)}
.pool:empty{display:none}
.seq{border:2px dashed var(--c);background:#fff}
.seq:empty::before{content:"Εδώ μπαίνουν με τη σειρά";color:var(--muted);font-size:15px;padding:6px}
.chipbtn{appearance:none;text-align:left;border:2px solid var(--c);background:#fff;color:var(--fg);font:600 17px var(--f-body);padding:10px 14px;border-radius:12px;cursor:pointer}
.seq .chipbtn{background:var(--c-soft)}
.seq .chipbtn span{color:var(--c);font-weight:800;margin-right:8px}
.seq.ok{border-color:var(--good)} .seq.no{border-color:var(--bad)}
ol.right{margin:6px 0;padding-left:24px}
.acrow{display:grid;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}
.acrow label{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acrow .acrow input{width:100%;text-transform:uppercase;letter-spacing:2px}
.acrow.hid{border-bottom:0}
.agrid{display:grid;gap:3px;margin:8px auto;width:100%}
.agrid i{aspect-ratio:1;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:clamp(11px,3.4vw,18px);background:#fff;min-width:0}
.agrid i.e{border:0;background:none}
.agrid i.k{background:var(--c-soft);border-color:var(--c)}
.agrid b{font-size:12px;color:var(--muted);align-self:center;text-align:right;padding-right:2px}

/* ανάδραση */
.fb{border-radius:14px;padding:12px 14px;font-size:17px}
.fb.ok{background:var(--good-soft);border:2px solid var(--good)}
.fb.no{background:var(--bad-soft);border:2px solid var(--bad)}
.fb.part{background:var(--mid-soft);border:2px solid var(--mid)}
.fb strong{display:block;font-family:var(--f-display);font-size:19px;margin-bottom:2px}
#fbx:empty{display:none}
#fbx{display:flex;flex-direction:column;gap:10px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.keys span{font-size:15px;font-weight:700;padding:4px 10px;border-radius:999px}
.keys .kok{background:var(--good-soft);color:#166b3e}
.keys .kno{background:var(--bad-soft);color:#a82a1e}
.ans{background:#fff;border:2px solid var(--c);border-radius:14px;padding:12px 14px}
.ans p{margin:6px 0 0}
.ans p.big{font-size:19px;line-height:1.55}
.ans .row{flex-wrap:nowrap}
.ans .row b{color:var(--c);font-family:var(--f-display)}
details{margin-top:8px}
summary{cursor:pointer;font-weight:700;color:var(--c);padding:4px 0}
.book p{margin:6px 0;font-size:17px}
.book li{margin:4px 0;font-size:17px}
.opin{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:16px}
.starmsg{font-family:var(--f-display);font-weight:700;font-size:19px;text-align:center;padding:8px;border-radius:12px;background:var(--mid-soft)}
.starmsg.win{background:var(--good-soft)}
.starmsg.lose{background:var(--soft);font-size:16px}

/* μάθε τις 15 */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.eqc{appearance:none;border:2px solid var(--c-soft);background:#fff;border-radius:14px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--fg);min-height:110px}
.eqc:hover{border-color:var(--c)}
.eqc b{font-family:var(--f-display);color:var(--c);font-size:18px}
.eqc span{font-size:15px;font-weight:600;line-height:1.3;flex:1}
.eqc i{font-style:normal;font-size:16px;letter-spacing:1px}
.eqc.done{background:var(--good-soft);border-color:var(--good)}
.steps{display:grid;gap:6px;margin:0;padding-left:22px;font-size:16px}

/* μαθήματα */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.lbtn{appearance:none;border:2px solid var(--c);background:var(--c-soft);border-radius:14px;padding:12px;text-align:left;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;gap:2px}
.lbtn b{color:var(--c);font-family:var(--f-display);font-size:17px}
.lbtn span{font-size:15px;font-weight:600}

/* αποτελέσματα */
.score{display:flex;align-items:center;gap:16px}
.score .big{font-family:var(--f-display);font-size:46px;font-weight:700;color:var(--c);line-height:1}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:15px}
.barrow .tr{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:999px}
.barrow b{text-align:right}
.mist{border-top:1px dashed var(--line);padding:8px 0;font-size:16px}
.mist .q{font-weight:700}
.mist .r{color:#166b3e}
.hrow{display:grid;grid-template-columns:110px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.hrow .htr{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.hrow .htr i{display:block;height:100%;border-radius:999px}
.hrow b{text-align:right}

@media (max-width:520px){
  body{font-size:17px}
  h1{font-size:24px}
  .qtext{font-size:19px}
  .eqq{font-size:18px}
  .card{padding:14px}
  .matchrow{grid-template-columns:1fr}
  .eqgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hrow{grid-template-columns:90px minmax(0,1fr) 44px}
}

/* μπρος-πίσω */
.navrow{margin-top:4px}
.navrow .sp{flex:1}
.navrow .btn{min-height:50px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{appearance:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--muted);font:700 14px var(--f-body);cursor:pointer;padding:0}
.dot:hover{border-color:var(--c)}
.dot.d-draft{border-color:var(--c);color:var(--c)}
.dot.d-ok{background:var(--good);border-color:var(--good);color:#fff}
.dot.d-part{background:#f0a020;border-color:#f0a020;color:#fff}
.dot.d-no{background:#e5484d;border-color:#e5484d;color:#fff}
.dot.cur{outline:3px solid var(--c);outline-offset:2px}
.ans .at{display:block;color:var(--c);font-family:var(--f-display)}
@media (max-width:520px){
  .dot{width:30px;height:30px;font-size:13px}
  .navrow .btn{font-size:16px;padding:10px 12px}
  .navrow #chk,.navrow #readok{order:-1;flex-basis:100%}
}

</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">🏛️ Ιστορία Ε΄ · Μαθήματα 5-12</span></div>
  <main id="view"><noscript>Για να δουλέψει το κουίζ χρειάζεται JavaScript.</noscript></main>
</div>
<script>
/* ===================== ΠΕΡΙΕΧΟΜΕΝΟ =====================
   Όλα από το βιβλίο Ιστορίας Ε΄ (μαθήματα 5-12) και το φύλλο «Ανακεφαλαίωση (Κεφ.5-12)» της δασκάλας.
   Κανόνας: τα γεγονότα όπως τα λέει το βιβλίο (π.χ. 324 μ.Χ. νίκη επί του Λικίνιου στην Αδριανούπολη). */

const L = {
  m5:  {n:"Μάθημα 5",     name:"Μεγάλες αλλαγές στη διοίκηση",        col:"#2f6fdb", soft:"#e3edff"},
  m6:  {n:"Μαθήματα 6-7", name:"Η νέα πρωτεύουσα, η Κωνσταντινούπολη", col:"#0f9488", soft:"#dcf5f1"},
  m8:  {n:"Μάθημα 8",     name:"Ο Χριστιανισμός επίσημη θρησκεία",     col:"#7a4cd9", soft:"#efe8ff"},
  m10: {n:"Μάθημα 10",    name:"Το Παλάτι, ο Ιππόδρομος και οι Δήμοι", col:"#e0662b", soft:"#ffeadf"},
  m11: {n:"Μάθημα 11",    name:"Η καθημερινή ζωή στο Βυζάντιο",        col:"#c2417a", soft:"#fde4ef"},
  m12: {n:"Μάθημα 12",    name:"Η εκπαίδευση στο Βυζάντιο",            col:"#2f9e44", soft:"#e1f5e5"}
};

/* ---------- Οι 15 ερωτήσεις της δασκάλας ----------
   short: η απάντηση με λίγα λόγια · book: τα λόγια του βιβλίου · rec: βήμα 1 (βρες τη σωστή)
   p ή m: βήμα 2 (διάλεξε τα σωστά / ταίριαξε) · ct: βήμα 3 (συμπλήρωσε, [[λέξη]] = κενό)
   keys: βήμα 4 (γράψε μόνη σου) — λέξεις-κλειδιά· "^" = ολόκληρη λέξη · must: απαραίτητο · need: πόσα σημεία φτάνουν */
const EQ = [
{n:1, l:"m5", pg:"21", title:"Προβλήματα του 3ου αιώνα και τετραρχία",
 q:"Ποια προβλήματα αντιμετώπιζε η αυτοκρατορία τον 3ο αιώνα; Τι έκανε ο Διοκλητιανός για να το αντιμετωπίσει;",
 short:"Γειτονικοί λαοί, οι Γότθοι και οι Πέρσες, παραβίαζαν τα σύνορα. Ο στρατός είχε γίνει παντοδύναμος. Επαρχίες της Ανατολής αποσχίστηκαν και έκαναν δικά τους κράτη. Γίνονταν σκληροί διωγμοί κατά των Χριστιανών. Ο Διοκλητιανός εφάρμοσε την τετραρχία: χώρισε την αυτοκρατορία σε τέσσερις μεγάλες περιφέρειες, δύο στην Ανατολή και δύο στη Δύση, με δικό της άρχοντα η καθεμιά.",
 book:["Από τις αρχές του 3ου αιώνα μ.Χ. όμως τη μακρόχρονη ρωμαϊκή ειρήνη άρχισαν να κλονίζουν εσωτερικά και εξωτερικά γεγονότα, που απείλησαν ακόμη και τη διάλυση του κράτους. Συγκεκριμένα:",
  "• Γειτονικοί λαοί, οι Γότθοι στο βορρά και οι Πέρσες στην ανατολή, παραβίαζαν τα σύνορα, λεηλατούσαν τις ακριτικές επαρχίες και έκλειναν τους δρόμους του εμπορίου.",
  "• Ο στρατός είχε γίνει παντοδύναμος. Οι στρατιωτικές δυνάμεις, αντί να φρουρούν τα σύνορα, στασίαζαν ή συγκρούονταν μεταξύ τους και συχνά όριζαν ή καταργούσαν τους αυτοκράτορες.",
  "• Κάποιες ακριτικές επαρχίες της Ανατολής αποσχίστηκαν από την αυτοκρατορία και έκαναν δικά τους κράτη.",
  "• Οι σκληροί διωγμοί κατά των Χριστιανών προκαλούσαν τη δυσαρέσκεια των πιστών της νέας θρησκείας για το ρωμαϊκό κράτος και έντονο διχασμό ανάμεσα σε αυτούς και τους οπαδούς των άλλων θρησκειών.",
  "Ο αυτοκράτορας Διοκλητιανός προσπάθησε να αντιμετωπίσει αυτά τα προβλήματα με το σύστημα της τετραρχίας. Χώρισε δηλαδή την αυτοκρατορία σε τέσσερις μεγάλες περιφέρειες, δύο στην Ανατολή, δύο στη Δύση, και όρισε για καθεμιά το δικό της άρχοντα, με αυξημένες εξουσίες. Το σύστημα αυτό επανέφερε ηρεμία και τάξη στο εσωτερικό του κράτους και ασφάλεια στα σύνορα από τις εχθρικές επιδρομές. Δεν κράτησε όμως πολύ."],
 rec:{a:"Γότθοι και Πέρσες στα σύνορα, παντοδύναμος στρατός, αποσχίσεις και διωγμοί των Χριστιανών. Ο Διοκλητιανός εφάρμοσε την τετραρχία.",
      w:["Ούννοι και Βάνδαλοι στα σύνορα και έλλειψη νερού. Ο Διοκλητιανός μετέφερε την πρωτεύουσα στο Βυζάντιο.",
         "Σεισμοί και φτώχεια. Ο Διοκλητιανός κήρυξε τον Χριστιανισμό επίσημη θρησκεία.",
         "Γότθοι και Πέρσες στα σύνορα. Ο Διοκλητιανός υπέγραψε το Διάταγμα της ανεξιθρησκίας."]},
 p:{q:"Ποια ήταν τα προβλήματα της αυτοκρατορίας τον 3ο αιώνα;",
    ok:["Οι Γότθοι και οι Πέρσες παραβίαζαν τα σύνορα","Ο στρατός είχε γίνει παντοδύναμος","Επαρχίες της Ανατολής αποσχίστηκαν","Σκληροί διωγμοί κατά των Χριστιανών"],
    no:["Οι Δήμοι φιλονικούσαν στον ιππόδρομο","Δεν υπήρχαν αγορές στις πόλεις","Καταργήθηκαν οι Ολυμπιακοί αγώνες"]},
 ct:"Γειτονικοί λαοί, οι [[Γότθοι]] στο βορρά και οι [[Πέρσες]] στην ανατολή, παραβίαζαν τα σύνορα. Ο [[στρατός]] είχε γίνει παντοδύναμος. Ο Διοκλητιανός προσπάθησε να αντιμετωπίσει τα προβλήματα με το σύστημα της [[τετραρχίας]]. Χώρισε την αυτοκρατορία σε [[τέσσερις]] μεγάλες περιφέρειες.",

{n:2, l:"m5", pg:"21", title:"Ο Κωνσταντίνος μονοκράτορας",
 q:"Ποια σημαντική αλλαγή έγινε στη διοίκηση της αυτοκρατορίας μετά την αποτυχία της Τετραρχίας;",
 short:"Οι συνάρχοντες συγκρούστηκαν μεταξύ τους. Το 324 μ.Χ. ο Κωνσταντίνος νίκησε τον Λικίνιο στην Αδριανούπολη και έγινε μονοκράτορας. Αναδιοργάνωσε τον στρατό, διόρισε έπαρχους με πολλές εξουσίες, οργάνωσε διπλωματικές επαφές με τους γειτονικούς λαούς, έκοψε νέο χρυσό νόμισμα και μετέφερε την πρωτεύουσα από τη Ρώμη στο Βυζάντιο.",
 book:["Μετά την παραίτηση του Διοκλητιανού, οι τέσσερις συνάρχοντες, που αυτός είχε ορίσει, ο Κωνσταντίνος και ο Μαξέντιος στη Δύση, ο Λικίνιος και ο Γαλέριος στην Ανατολή, συγκρούστηκαν μεταξύ τους. Νικητές από τις εμφύλιες αυτές διαμάχες βγήκαν ο Κωνσταντίνος και ο Λικίνιος.",
  "Λίγα χρόνια αργότερα (324 μ.Χ.), ο Κωνσταντίνος και ο Λικίνιος συγκρούστηκαν στην Αδριανούπολη. Νικητής από αυτή την εμφύλια διαμάχη βγήκε ο Κωνσταντίνος, ο οποίος έγινε μονοκράτορας.",
  "Ο Κωνσταντίνος προχώρησε σε σημαντικές αλλαγές για την καλύτερη διοίκηση της αυτοκρατορίας:",
  "• Αναδιοργάνωσε το διασπασμένο από την τετραρχία στρατό.","• Διόρισε έπαρχους με πολλές εξουσίες στις περιφέρειες του κράτους.","• Οργάνωσε διπλωματικές επαφές με τους γειτονικούς λαούς.","• Έκοψε νέο χρυσό νόμισμα, που κυκλοφόρησε παντού και τόνωσε την οικονομία.","• Μετέφερε την πρωτεύουσα από τη Ρώμη στο Βυζάντιο.",
  "Για τις τολμηρές του αποφάσεις, οι οποίες είχαν ευεργετικά αποτελέσματα για την αυτοκρατορία, οι ιστορικοί ονόμασαν τον Κωνσταντίνο Μέγα και οι χριστιανοί Άγιο και ισαπόστολο."],
 rec:{a:"Ο Κωνσταντίνος έγινε μονοκράτορας (324 μ.Χ.) και έκανε αλλαγές για καλύτερη διοίκηση.",
      w:["Ο Διοκλητιανός χώρισε την αυτοκρατορία σε οκτώ περιφέρειες.","Ο Λικίνιος έγινε μονοκράτορας και διέλυσε τον στρατό.","Ο Θεοδόσιος κήρυξε τον Χριστιανισμό επίσημη θρησκεία."]},
 p:{q:"Τι άλλαξε ο Κωνσταντίνος για να διοικείται καλύτερα η αυτοκρατορία;",
    ok:["Αναδιοργάνωσε τον στρατό","Διόρισε έπαρχους με πολλές εξουσίες","Οργάνωσε διπλωματικές επαφές με τους γειτονικούς λαούς","Έκοψε νέο χρυσό νόμισμα","Μετέφερε την πρωτεύουσα στο Βυζάντιο"],
    no:["Κατάργησε τους Ολυμπιακούς αγώνες","Έκλεισε όλα τα σχολεία","Χώρισε την αυτοκρατορία σε τέσσερις περιφέρειες"]},
 ct:"Το [[324]] μ.Χ. ο Κωνσταντίνος νίκησε τον [[Λικίνιο]] στην [[Αδριανούπολη]] και έγινε [[μονοκράτορας]]. Έκοψε νέο [[χρυσό]] νόμισμα και μετέφερε την [[πρωτεύουσα]] από τη Ρώμη στο Βυζάντιο.",
 keys:[{d:"μονοκράτορας",k:["μονοκρατορ","μονοσ του"],must:1},{d:"324 μ.Χ.",k:["324"]},{d:"νίκησε τον Λικίνιο",k:["λικινι"]},{d:"στρατός",k:["στρατ"]},{d:"έπαρχοι",k:["επαρχ"]},{d:"διπλωματικές επαφές",k:["διπλωματ"]},{d:"νέο χρυσό νόμισμα",k:["νομισμ"]},{d:"πρωτεύουσα στο Βυζάντιο",k:["πρωτευουσ","βυζαντι"]}], need:5},

{n:3, l:"m5", pg:"22", title:"Το Διάταγμα της ανεξιθρησκίας",
 q:"Τι αποφασίστηκε με το Διάταγμα της Ανεξιθρησκίας; Ποια ήταν η σημασία του;",
 short:"Αποφασίστηκε ότι κάθε πολίτης της αυτοκρατορίας μπορούσε να λατρεύει όποιο θεό θέλει. Το υπέγραψαν ο Κωνσταντίνος και ο Λικίνιος στο Μεδιόλανο, το 313 μ.Χ. Σημασία: έδωσε τέλος στην αναστάτωση από τους διωγμούς των Χριστιανών και λύση στις θρησκευτικές διαμάχες. Έτσι άνοιξε ο δρόμος για την εξάπλωση του Χριστιανισμού.",
 book:["Για να δώσουν τέλος στην αναστάτωση που είχαν προκαλέσει οι διωγμοί κατά των Χριστιανών, οι δύο συναυτοκράτορες [Κωνσταντίνος και Λικίνιος] υπέγραψαν στο Μεδιόλανο της Ιταλίας το Διάταγμα της ανεξιθρησκίας, το 313 μ.Χ. Σύμφωνα με αυτό, κάθε πολίτης της αυτοκρατορίας μπορούσε να λατρεύει όποιο θεό θέλει. Έτσι ο δρόμος για την εξάπλωση του Χριστιανισμού άνοιξε.",
  "Στην αρχή του μαθήματος: «Το διάταγμα της ανεξιθρησκίας δίνει λύση στις θρησκευτικές διαμάχες.»"],
 rec:{a:"Κάθε πολίτης μπορούσε να λατρεύει όποιο θεό θέλει. Έτσι άνοιξε ο δρόμος για την εξάπλωση του Χριστιανισμού.",
      w:["Ο Χριστιανισμός έγινε η μόνη επίσημη θρησκεία και έκλεισαν οι αρχαίοι ναοί.","Η πρωτεύουσα μεταφέρθηκε στο Βυζάντιο, πιο κοντά στα σύνορα.","Απαγορεύτηκε η λατρεία των ολύμπιων θεών και καταργήθηκαν οι Ολυμπιακοί αγώνες."]},
 p:{q:"Τι ισχύει για το Διάταγμα της ανεξιθρησκίας;",
    ok:["Το υπέγραψαν ο Κωνσταντίνος και ο Λικίνιος","Υπογράφηκε στο Μεδιόλανο το 313 μ.Χ.","Κάθε πολίτης μπορούσε να λατρεύει όποιο θεό θέλει","Άνοιξε ο δρόμος για την εξάπλωση του Χριστιανισμού"],
    no:["Υπογράφηκε στη Νίκαια το 325 μ.Χ.","Έκλεισε τους αρχαίους ναούς","Το υπέγραψε ο Θεοδόσιος"]},
 ct:"Οι δύο συναυτοκράτορες υπέγραψαν στο [[Μεδιόλανο]] της Ιταλίας το Διάταγμα της ανεξιθρησκίας, το [[313]] μ.Χ. Σύμφωνα με αυτό, κάθε [[πολίτης]] της αυτοκρατορίας μπορούσε να λατρεύει όποιο [[θεό]] θέλει. Έτσι ο δρόμος για την [[εξάπλωση]] του Χριστιανισμού άνοιξε.",

{n:4, l:"m6", pg:"22", title:"Η νέα πρωτεύουσα",
 q:"Πού μετέφερε ο Κωνσταντίνος την πρωτεύουσα της αυτοκρατορίας και γιατί; Ήταν η νέα πρωτεύουσα ισάξια της Ρώμης; Γιατί;",
 short:"Από τη Ρώμη στο Βυζάντιο, μια αρχαία ελληνική αποικία στην Προποντίδα. Το επίσημο όνομα ήταν «Νέα Ρώμη», αλλά όλοι την έλεγαν Κωνσταντινούπολη. Γιατί: η Ρώμη ήταν πολύ μακριά από τα σύνορα του Δούναβη και της Ανατολής και ήταν κέντρο της παλιάς θρησκείας. Η θέση της νέας πρωτεύουσας ήταν εξαιρετική: εκεί ενώνονταν οι δρόμοι της Ευρώπης με την Ασία και του Εύξεινου Πόντου με το Αιγαίο, και εκεί κατέληγε η Εγνατία οδός. Ναι, ήταν ισάξια της Ρώμης: σε έξι χρόνια οχυρώθηκε με τείχη και στολίστηκε με την αγορά, έργα τέχνης, ναούς, κρήνες, λουτρά, υδραγωγεία και δεξαμενές.",
 book:["Ο μονοκράτορας Κωνσταντίνος όμως διαπίστωσε ότι η διακυβέρνηση της απέραντης αυτοκρατορίας από τη Ρώμη ήταν δύσκολη επειδή:",
  "• Βρισκόταν πολύ μακριά από τις ακριτικές περιοχές του Δούναβη και της Ανατολής, που δέχονταν εχθρικές επιδρομές.",
  "• Ήταν για πολλά χρόνια κέντρο λατρείας του «ρωμαϊκού πανθέου» και ο χώρος που έγιναν σκληρές συγκρούσεις ανάμεσα στους τετράρχες αλλά και διωγμοί των Χριστιανών.",
  "Μετέφερε την πρωτεύουσα από τη Ρώμη στο Βυζάντιο, μια αρχαία ελληνική αποικία στην Προποντίδα. […] Το επίσημο όνομα της νέας πρωτεύουσας, με απόφαση του ιδρυτή της, ήταν «Νέα Ρώμη». Όλοι όμως την έλεγαν Κωνσταντινούπολη και αργότερα απλώς Πόλη. Η θέση της ήταν εξαιρετική. Εκεί συναντιόνταν οι δρόμοι που ένωναν την Ευρώπη με την Ασία, αλλά και τον Εύξεινο Πόντο με το Αιγαίο και τη Μεσόγειο. Σ’ αυτή κατέληγε η Εγνατία οδός.",
  "Μάθημα 7: Η θεμελίωσή της έγινε από τον αυτοκράτορα, το Νοέμβριο του 324 μ.Χ., και τα εγκαίνιά της το Μάιο του 330 μ.Χ. Ο Κωνσταντίνος επισκεύασε την ακρόπολη και τα παλιά τείχη της και έκτισε νέα, για να προστατέψει τις νεοκτισμένες περιοχές. […] Χτίστηκε η μεγάλη αγορά […]. Μεταφέρθηκαν εδώ έργα τέχνης από τη Ρώμη και άλλα μέρη της αυτοκρατορίας. Διατηρήθηκαν βωμοί και ναοί της παλιάς θρησκείας και χτίστηκαν νέοι χριστιανικοί. Κατασκευάστηκαν κρήνες, λουτρά, υδραγωγεία, και τεράστιες δεξαμενές που εξασφάλιζαν νερό για έξι μήνες.",
  "Όλα αυτά ασφάλισαν και διακόσμησαν τη νέα πρωτεύουσα, κάνοντάς την ισάξια της Ρώμης."],
 rec:{a:"Στο Βυζάντιο (Κωνσταντινούπολη), γιατί η Ρώμη ήταν μακριά από τα σύνορα και η νέα θέση ήταν εξαιρετική. Ναι, έγινε ισάξια της Ρώμης με τείχη και έργα τέχνης.",
      w:["Στο Μεδιόλανο, γιατί εκεί υπογράφηκε το Διάταγμα. Όχι, ήταν πολύ μικρότερη από τη Ρώμη.","Στην Αθήνα, γιατί ο Κωνσταντίνος θαύμαζε τους ολύμπιους θεούς. Ναι, γιατί είχε την Ακρόπολη.","Στο Βυζάντιο, γιατί η Ρώμη δεν είχε νερό. Όχι, γιατί δεν είχε καθόλου τείχη."]},
 p:{q:"Γιατί ο Κωνσταντίνος διάλεξε το Βυζάντιο για πρωτεύουσα;",
    ok:["Η Ρώμη ήταν πολύ μακριά από τα σύνορα του Δούναβη και της Ανατολής","Η Ρώμη ήταν κέντρο λατρείας της παλιάς θρησκείας","Η θέση του Βυζαντίου ένωνε την Ευρώπη με την Ασία","Εκεί κατέληγε η Εγνατία οδός","Οι κάτοικοι της Ανατολής στήριζαν τον Κωνσταντίνο"],
    no:["Στο Βυζάντιο γίνονταν οι Ολυμπιακοί αγώνες","Η Ρώμη είχε καταστραφεί από σεισμό","Το Βυζάντιο ήταν μακριά από τη θάλασσα"]},
 ct:"Ο Κωνσταντίνος μετέφερε την πρωτεύουσα από τη Ρώμη στο [[Βυζάντιο]]. Το επίσημο όνομα ήταν «Νέα [[Ρώμη]]», αλλά όλοι την έλεγαν [[Κωνσταντινούπολη]]. Η Ρώμη βρισκόταν πολύ [[μακριά]] από τις ακριτικές περιοχές. Όλα τα έργα ασφάλισαν και διακόσμησαν τη νέα πρωτεύουσα, κάνοντάς την [[ισάξια]] της Ρώμης.",
 keys:[{d:"στο Βυζάντιο",k:["βυζαντι"],must:1},{d:"Κωνσταντινούπολη / Νέα Ρώμη",k:["κωνσταντινουπολ","νεα ρωμ","πολη"]},{d:"η Ρώμη ήταν μακριά από τα σύνορα",k:["μακρια","συνορ","επιδρομ"]},{d:"η Ρώμη ήταν κέντρο της παλιάς θρησκείας",k:["πανθε","παλια θρησκ","παλιασ θρησκ","παλαιασ θρησκ","παλιουσ θε","αρχαιουσ θε","διωγμ","θρησκει","θεων"]},{d:"εξαιρετική θέση (Ευρώπη-Ασία)",k:["θεση","ευρωπ","ασια","εγνατια","δρομ"]},{d:"ναι, ισάξια",k:["ισαξι","^ναι"]},{d:"τείχη / οχύρωση",k:["τειχ","οχυρ"]},{d:"έργα τέχνης / στολισμός",k:["τεχν","στολισ","διακοσμ","αγορ","ναο"]},{d:"νερό (δεξαμενές, υδραγωγεία)",k:["νερο","δεξαμεν","υδραγωγ","κρην","λουτρ"]}], need:6},

{n:5, l:"m8", pg:"29-30", title:"Ο Ιουλιανός ο «Παραβάτης»",
 q:"Γιατί ο Ιουλιανός ονομάστηκε Παραβάτης;",
 short:"Ο Ιουλιανός, ανιψιός του Κωνσταντίνου, έγινε αυτοκράτορας το 361 μ.Χ. Θαύμαζε τον ελληνικό πολιτισμό και τους ολύμπιους θεούς. Γι’ αυτό προσπάθησε να επαναφέρει τη λατρεία της παλαιάς θρησκείας και να περιορίσει τη χριστιανική. Γι’ αυτό οι χριστιανοί τον ονόμασαν «Παραβάτη» ή «Αποστάτη».",
 book:["Η πολιτική αυτή διακόπηκε όταν, το 361 μ.Χ., ανέλαβε αυτοκράτορας ο ανιψιός του Κωνσταντίνου, Ιουλιανός. Ο Ιουλιανός είχε σπουδάσει αρχαία ελληνική φιλοσοφία στην Αθήνα και την Αντιόχεια. Οι σπουδές και η ζωή του στην Αθήνα τού προκάλεσαν το θαυμασμό για τον ελληνικό πολιτισμό, τους ολύμπιους θεούς και τη λατρεία τους. Γι’ αυτό, όταν έγινε αυτοκράτορας, προσπάθησε να επαναφέρει τη λατρεία της παλαιάς θρησκείας και να περιορίσει τη χριστιανική.",
  "Έτσι, τα μέτρα αυτά δεν είχαν τα αποτελέσματα που περίμενε ο αυτοκράτορας και δε βρήκαν ανταπόκριση στο λαό. Ο Ιουλιανός άλλωστε κυβέρνησε την αυτοκρατορία μόνο για δύο χρόνια (361-363 μ.Χ.) και σκοτώθηκε πολεμώντας τους Πέρσες, σε ηλικία 32 ετών.",
  "Για όλα αυτά οι χριστιανοί ονόμασαν το Θεοδόσιο «Μέγα» και τον Ιουλιανό «Παραβάτη» ή «Αποστάτη»."],
 rec:{a:"Γιατί προσπάθησε να επαναφέρει την παλαιά θρησκεία και να περιορίσει τη χριστιανική.",
      w:["Γιατί παραβίασε τα σύνορα των Περσών.","Γιατί κατάργησε τους Ολυμπιακούς αγώνες.","Γιατί δεν υπέγραψε το Διάταγμα της ανεξιθρησκίας."]},
 p:{q:"Τι ισχύει για τον Ιουλιανό;",
    ok:["Ήταν ανιψιός του Κωνσταντίνου","Σπούδασε φιλοσοφία στην Αθήνα και την Αντιόχεια","Θαύμαζε τους ολύμπιους θεούς","Τα μέτρα του δε βρήκαν ανταπόκριση στον λαό","Σκοτώθηκε πολεμώντας τους Πέρσες"],
    no:["Κυβέρνησε τριάντα χρόνια","Ήταν γιος του Κωνσταντίνου","Κήρυξε τον Χριστιανισμό επίσημη θρησκεία"]},
 ct:"Το [[361]] μ.Χ. έγινε αυτοκράτορας ο [[ανιψιός]] του Κωνσταντίνου, Ιουλιανός. Θαύμαζε τον ελληνικό πολιτισμό και τους [[ολύμπιους]] θεούς. Προσπάθησε να επαναφέρει τη λατρεία της [[παλαιάς]] θρησκείας και να περιορίσει τη [[χριστιανική]]. Οι χριστιανοί τον ονόμασαν «Παραβάτη» ή «[[Αποστάτη]]».",
 keys:[{d:"να επαναφέρει (να φέρει πίσω)",k:["επαναφερ","πισω","ξαναφερ"]},{d:"την παλαιά θρησκεία / τους ολύμπιους θεούς",k:["παλαι","παλι","αρχαι","ολυμπι","θεουσ","θεων"],must:1},{d:"να περιορίσει τη χριστιανική",k:["περιορισ","χριστιανικ","κατα των χριστιαν"]},{d:"έτσι τον ονόμασαν οι χριστιανοί",k:["χριστιανοι","ονομασ"]}], need:2},

{n:6, l:"m8", pg:"30", title:"Τα μέτρα του Θεοδόσιου",
 q:"Με ποια μέτρα προσπάθησε ο Θεοδόσιος να ενισχύσει τον Χριστιανισμό; Ποια είναι η γνώμη σου γι’ αυτά;",
 short:"Ο Θεοδόσιος κήρυξε τον Χριστιανισμό επίσημη θρησκεία και πήρε αυστηρά μέτρα κατά της θρησκείας των εθνικών: έκλεισε τους αρχαίους ναούς, απαγόρευσε τη λατρεία των αρχαίων θεών και όρισε με νόμο βαρύτατες ποινές, κατάργησε τους Ολυμπιακούς αγώνες (392 μ.Χ.) και τα Ελευσίνια μυστήρια, έκλεισε το Μαντείο των Δελφών και ανέχτηκε την καταστροφή αρχαίων ναών, μνημείων και έργων τέχνης από φανατικούς χριστιανούς.",

{w:"ΠΟΛΗ",i:"Έτσι έλεγαν απλώς την Κωνσταντινούπολη."},
{w:"ΔΗΜΟΙ",i:"Οι Δήμοι οργάνωναν τις ιπποδρομίες."},
{w:"ΝΙΚΑΙΑ",i:"Εκεί έγινε η Οικουμενική Σύνοδος, το 325 μ.Χ."},
{w:"ΤΕΙΧΗ",i:"Ο Κωνσταντίνος επισκεύασε τα παλιά τείχη και έχτισε νέα."},
{w:"ΑΓΟΡΑ",i:"Στις αγορές γινόταν το εμπόριο."},
{w:"ΣΧΟΛΕΙΟ",i:"Στο σχολείο πήγαιναν μόνο τα αγόρια."},
{w:"ΜΕΓΑΣ",i:"Έτσι ονόμασαν τον Κωνσταντίνο (οι ιστορικοί) και τον Θεοδόσιο (οι χριστιανοί)."},
{w:"ΡΩΜΗ",i:"Από τη Ρώμη μεταφέρθηκε η πρωτεύουσα στο Βυζάντιο."},
{w:"ΕΛΕΝΗ",i:"Η μητέρα του Κωνσταντίνου."}
];

</script>
<script>
"use strict";
/* ===================== ΒΟΗΘΗΤΙΚΑ ===================== */
const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sample = (a, n) => shuffle(a).slice(0, n);
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function store(k, v){ try{ if(v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
/* κείμενο χωρίς τόνους, πεζά, ς→σ */
function norm(s){ return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ς/g, "σ").replace(/[^a-z0-9α-ω]+/g, " ").trim(); }
/* «ηχητική» μορφή: δεν μετράνε τα ορθογραφικά (ω/ο, η/ι/υ/ει/οι, αι/ε, διπλά σύμφωνα) */
function phon(s){
  let t = norm(s);
  t = t.replace(/ου/g, "#").replace(/αυ/g, "αβ").replace(/ευ/g, "εβ").replace(/ει|οι|υι/g, "ι").replace(/αι/g, "ε").replace(/[ηυ]/g, "ι").replace(/ω/g, "ο").replace(/#/g, "ου");
  return t.replace(/([βγδζθκλμνξπρστφχψ])\1/g, "$1");
}
function lev(a, b){ const m = a.length, n = b.length; if(!m) return n; if(!n) return m; let p = Array.from({length: n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){ const c = [i]; for(let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
/* σωστή λέξη; (δεκτά τα μικρά ορθογραφικά) */
function near(typed, target){ const A = phon(typed).replace(/ /g, ""), B = phon(target).replace(/ /g, ""); if(!A) return false; if(A === B) return true; const tol = B.length >= 9 ? 2 : B.length >= 5 ? 1 : 0; return lev(A, B) <= tol; }
function exact(typed, target){ return norm(typed).replace(/ /g, "") === norm(target).replace(/ /g, ""); }
const PRAISE = ["Μπράβο!", "Τέλεια!", "Σωστά!", "Πολύ ωραία!", "Ναι, αυτό είναι!"];
const pick1 = a => a[rnd(a.length)];
function setColor(c){ document.documentElement.style.setProperty("--c", c ? c.col : "#7a4cd9"); document.documentElement.style.setProperty("--c-soft", c ? c.soft : "#efe8ff"); }
function starStr(n){ n = n || 0; return "★".repeat(Math.min(4, n)) + "☆".repeat(Math.max(0, 4 - n)); }
function getName(){ try{ return (localStorage.getItem("kouiz-name") || "").trim(); }catch(e){ return ""; } }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-home],[data-learnhome]"); if(!t) return;
  if(t.hasAttribute("data-home")) renderHome(); else renderLearnHome();
});

/* ===================== ΔΕΔΟΜΕΝΑ ΣΕ ΑΝΤΙΚΕΙΜΕΝΑ ===================== */
const EQN = {}; EQ.forEach(q => EQN[q.n] = q);
const TFS = TF.map(r => ({l:r[0], t:r[1], f:r[2], e:r[3]}));
const MCS = MC.map(r => ({l:r[0], q:r[1], a:r[2], w:r.slice(3, 6)}));
const WHOS = WHO.map(r => ({l:r[0], s:r[1], a:r[2], set:r[3]}));
const CLS = CLOZE.map(r => ({l:r[0], s:r[1]}));
const SECS = {tf:"Σωστό ή Λάθος", mc:"Πολλαπλής επιλογής", who:"Ποιος το έκανε;", match:"Αντιστοίχιση", cloze:"Συμπλήρωσε τα κενά", order:"Χρονολογική σειρά", acro:"Ακροστιχίδα", open:"Απάντησε στην ερώτηση"};
const SECORD = ["tf","mc","who","match","cloze","order","acro","open"];
const LSL = "istoria512-learn-v1", LSH = "istoria512-hist-v1", LSP = "istoria512-prova-v2";

/* ===================== ΔΗΜΙΟΥΡΓΙΑ ΕΡΩΤΗΣΕΩΝ ===================== */
function parseBl(str){ const seg = [], ans = []; str.split(/\[\[(.+?)\]\]/).forEach((p, i) => { if(i % 2){ seg.push({b: ans.length}); ans.push(p); } else if(p) seg.push(p); }); return {seg, ans}; }
function strat(pool, n){ const by = {}; shuffle(pool).forEach(x => (by[x.l] = by[x.l] || []).push(x)); const ks = shuffle(Object.keys(by)); const out = []; let i = 0, guard = 0;
  while(out.length < n && ks.some(k => by[k].length) && guard++ < 999){ const k = ks[i % ks.length]; if(by[k].length) out.push(by[k].shift()); i++; } return out; }
function mkTF(s){ const flip = !!s.f && Math.random() < 0.5; return {t:"tf", sec:"tf", l:s.l, text: flip ? s.f : s.t, ans: !flip, fix: s.t, e: s.e || ""}; }
function mkMC(s){ const opts = shuffle([s.a, ...s.w]); return {t:"mc", sec:"mc", l:s.l, q:s.q, opts, a: opts.indexOf(s.a)}; }
function mkWho(s){ const set = WHOSET[s.set]; const opts = shuffle([s.a, ...sample(set.filter(x => x !== s.a), 3)]); return {t:"mc", sec:"who", l:s.l, q:"Ποιος το έκανε;", sub:s.s, opts, a: opts.indexOf(s.a)}; }
function mkCloze(list, extra){
  const sents = []; let blanks = [];
  list.forEach(x => { const {seg, ans} = parseBl(x.s); const off = blanks.length; sents.push(seg.map(g => typeof g === "string" ? g : {b: g.b + off})); blanks = blanks.concat(ans); });
  const bank = shuffle([...new Set([...blanks, ...extra])]);
  const ls = [...new Set(list.map(x => x.l))];
  return {t:"cloze", sec:"cloze", l: ls.length === 1 ? ls[0] : "mix", q:"Συμπλήρωσε τα κενά με τις λέξεις από το κουτί.", sents, blanks, bank};
}
function clozeFor(list){ const used = new Set(list); const extra = sample(CLS.filter(x => !used.has(x)).map(x => parseBl(x.s).ans[0]), 2); return mkCloze(list, extra); }
function mkMatch(set, n){ const pairs = sample(set.pairs, n || 5); const rest = set.pairs.filter(p => !pairs.includes(p)); const extra = rest.length ? [rest[rnd(rest.length)][1]] : [];
  return {t:"match", sec:"match", l:"mix", q:set.q, rows: pairs.map(p => ({k:p[0], v:p[1]})), opts: shuffle([...pairs.map(p => p[1]), ...extra])}; }
function mkOrder(n){ const ev = sample(ORDER, n || 5).sort((a, b) => a.y - b.y); return {t:"order", sec:"order", l:"mix", q:"Βάλε τα γεγονότα στη σωστή χρονολογική σειρά.", ev}; }
function genAcro(){
  for(let tries = 0; tries < 400; tries++){
    const H = HIDDEN[rnd(HIDDEN.length)]; const used = new Set(), groups = new Set(), rows = []; let ok = true;
    for(const ch of H.w){
      const cands = ACRO.filter(b => !used.has(b.w) && b.w !== H.w && !(b.g && groups.has(b.g)) && b.w.includes(ch));
      if(!cands.length){ ok = false; break; }
      const b = cands[rnd(cands.length)]; const pos = [...b.w].map((c, i) => c === ch ? i : -1).filter(i => i >= 0);
      rows.push({w:b.w, clue:b.c, p: pos[rnd(pos.length)]}); used.add(b.w); if(b.g) groups.add(b.g);
    }
    if(!ok) continue;
    const Lm = Math.max(...rows.map(r => r.p)), R = Math.max(...rows.map(r => r.w.length - r.p));
    if(Lm + R > 14) continue;
    return {t:"acro", sec:"acro", l:"mix", hidden:H.w, info:H.i, rows};
  }
  return null;
}
function mkOpen(q){ return {t:"open", sec:"open", l:q.l, n:q.n}; }
function genProva(){
  let it = [];
  it = it.concat(strat(TFS, 10).map(mkTF));
  it = it.concat(strat(MCS, 6).map(mkMC));
  it = it.concat(strat(WHOS, 4).map(mkWho));
  it.push(mkMatch(MATCH[rnd(MATCH.length)], 5));
  it.push(clozeFor(strat(CLS, 4)));
  it.push(mkOrder(5));
  const a = genAcro(); if(a) it.push(a);
  strat(EQ, 3).sort((x, y) => x.n - y.n).forEach(q => it.push(mkOpen(q)));
  return it;
}
function genQuick(lk){
  if(lk === "all"){ return shuffle([...strat(TFS, 5).map(mkTF), ...strat(MCS, 3).map(mkMC), ...strat(WHOS, 2).map(mkWho)]).concat([clozeFor(strat(CLS, 2))]); }
  const f = a => a.filter(x => x.l === lk);
  const tf = sample(f(TFS), 5).map(mkTF), mc = sample(f(MCS), 3).map(mkMC), wh = sample(f(WHOS), 1).map(mkWho);
  const items = shuffle([...tf, ...mc, ...wh]);
  const cl = sample(f(CLS), 2); if(cl.length) items.push(clozeFor(cl));
  return items;
}
function maxPts(it){ switch(it.t){ case "match": return it.rows.length; case "cloze": case "ctype": return it.blanks.length; case "order": return it.ev.length; case "acro": return it.rows.length + 1; case "open": return 3; default: return 1; } }

/* ===================== ΜΗΧΑΝΗ ΕΡΩΤΗΣΕΩΝ ===================== */
function acroGrid(q, words){
  const Lm = Math.max(...q.rows.map(r => r.p)), R = Math.max(...q.rows.map(r => r.w.length - r.p)), N = Lm + R; let h = "";
  q.rows.forEach((r, i) => { h += `<b>${i + 1}</b>`; const off = Lm - r.p; const w = (words && words[i]) || []; for(let x = 0; x < N; x++){ const j = x - off; if(j < 0 || j >= r.w.length){ h += '<i class="e"></i>'; continue; } h += `<i class="${j === r.p ? "k" : ""}">${esc(w[j] || "")}</i>`; } });
  return `<div class="agrid" style="grid-template-columns:20px repeat(${N},minmax(0,1fr));max-width:${20 + N * 38}px">${h}</div>`;
}
const upL = s => [...norm(s).replace(/ /g, "").toUpperCase()];
function promptOf(it){
  switch(it.t){ case "tf": return it.text; case "mc": return it.q + (it.sub ? " «" + it.sub + "»" : ""); case "open": return EQN[it.n].q; case "acro": return "Ακροστιχίδα"; case "ctype": return "Συμπλήρωσε τις λέξεις"; default: return it.q; }
}
function keyFound(q, text){ const T = " " + phon(text) + " "; return q.keys.map(g => g.k.some(k => k[0] === "^" ? T.includes(" " + phon(k.slice(1)) + " ") : T.includes(phon(k)))); }
function bookHTML(q){ let h = "", inList = false; q.book.forEach(p => { if(p.startsWith("• ")){ if(!inList){ h += "<ul>"; inList = true; } h += `<li>${esc(p.slice(2))}</li>`; } else { if(inList){ h += "</ul>"; inList = false; } h += `<p>${esc(p)}</p>`; } }); if(inList) h += "</ul>"; return h; }
function answerBox(q, title){ return `<div class="ans"><b class="at">${title || "📖 Η απάντηση"}</b><p>${esc(q.short)}</p><details><summary>📘 Τα λόγια του βιβλίου</summary><div class="book">${bookHTML(q)}</div></details></div>`; }

/* Κουμπιά μπρος-πίσω.  n = {prev: fn|null, skip: fn|null, skipLabel, main: {label, fn, id, disabled}} */
function navRow(n){
  return `<div class="row navrow">
    <button class="btn ghost" id="nprev" ${n.prev ? "" : "disabled"}>← Προηγούμενη</button>
    <span class="sp"></span>
    ${n.skip ? `<button class="btn ghost" id="nskip">${n.skipLabel || "Επόμενη →"}</button>` : ""}
    ${n.main ? `<button class="btn" id="${n.main.id || "nmain"}" ${n.main.disabled ? "disabled" : ""}>${n.main.label}</button>` : ""}
  </div>`;
}
function bindNav(h, n){
  const p = h.querySelector("#nprev"); if(p && n.prev) p.onclick = n.prev;
  const s = h.querySelector("#nskip"); if(s && n.skip) s.onclick = n.skip;
  const m = h.querySelector("#" + ((n.main && n.main.id) || "nmain")); if(m && n.main && n.main.fn) m.onclick = n.main.fn;
}

/* o = {host, saved, checked, extra, onChange(draft), onChecked(r) -> extra html, prev, next, nextLabel, skipLabel} */
function runItem(it, o){
  const h = o.host, T = it.t, st = {checked:false}; let html = "";
  const L4 = "αβγδε";
  if(T === "tf"){ st.v = null;
    html = `<p class="qtext">${esc(it.text)}</p><p class="hintline">Είναι σωστό ή λάθος;</p><div class="opts tf"><button class="opt" data-v="1">✔ Σωστό</button><button class="opt" data-v="0">✘ Λάθος</button></div>`; }
  else if(T === "mc"){ st.v = null;
    html = `<p class="qtext">${esc(it.q)}</p>${it.sub ? `<blockquote class="stmt">${esc(it.sub)}</blockquote>` : ""}<div class="opts">${it.opts.map((x, i) => `<button class="opt" data-i="${i}"><b>${L4[i]}</b><span>${esc(x)}</span></button>`).join("")}</div>`; }
  else if(T === "pick"){ st.sel = new Set(); const nOk = it.opts.filter(x => x.ok).length;
    html = `<p class="qtext">${esc(it.q)}</p><p class="hintline">Πάτα <b>όλα</b> τα σωστά (είναι <b>${nOk}</b>). Ξαναπάτα για να το βγάλεις.</p><div class="opts">${it.opts.map((x, i) => `<button class="opt" data-i="${i}"><b>☐</b><span>${esc(x.s)}</span></button>`).join("")}</div>`; }
  else if(T === "match"){ st.v = it.rows.map(() => "");
    html = `<p class="qtext">${esc(it.q)}</p>${it.rows.map((r, i) => `<div class="matchrow" data-i="${i}"><span class="k">${esc(r.k)}</span><select data-i="${i}" aria-label="${esc(r.k)}"><option value="">— διάλεξε —</option>${it.opts.map(op => `<option>${esc(op)}</option>`).join("")}</select></div>`).join("")}`; }
  else if(T === "cloze"){ st.v = it.blanks.map(() => "");
    html = `<p class="qtext sm">${esc(it.q)}</p><div class="bank">${it.bank.map(w => `<span>${esc(w)}</span>`).join("")}</div><ol class="sents">${it.sents.map(s => `<li>${s.map(g => typeof g === "string" ? esc(g) : `<select class="bl" data-b="${g.b}" aria-label="κενό"><option value="">……</option>${it.bank.map(w => `<option>${esc(w)}</option>`).join("")}</select>`).join("")}</li>`).join("")}</ol>`; }
  else if(T === "ctype"){ st.v = it.blanks.map(() => "");
    html = `<p class="qtext sm">Συμπλήρωσε τις λέξεις που λείπουν. Σου δίνουμε το πρώτο γράμμα.</p><div class="ctext">${it.seg.map(g => typeof g === "string" ? esc(g) : `<input type="text" class="cb" data-b="${g.b}" placeholder="${esc(it.blanks[g.b][0])}…" style="width:${Math.max(5, it.blanks[g.b].length + 3)}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="κενό ${g.b + 1}">`).join("")}</div><p class="hintline">Δεν πειράζουν οι τόνοι και τα μικρά ορθογραφικά.</p>`; }
  else if(T === "order"){ st.seq = []; st.pool = shuffle(it.ev.map((_, i) => i));
    html = `<p class="qtext">${esc(it.q)}</p><p class="hintline">Πάτα τα γεγονότα με τη σειρά: <b>πρώτα το πιο παλιό</b>. Πάτα ξανά για να το βγάλεις.</p><div class="seq" id="seq"></div><div class="pool" id="pool"></div>`; }
  else if(T === "acro"){ st.v = it.rows.map(() => ""); st.hid = "";
    html = `<p class="qtext">Λύσε την ακροστιχίδα! Στη χρωματιστή στήλη κρύβεται μια λέξη με ${it.hidden.length} γράμματα.</p><div id="ag">${acroGrid(it)}</div>${it.rows.map((r, i) => `<div class="acrow"><label for="a${i}"><b>${i + 1}.</b> ${esc(r.clue)} <span class="note2">(${r.w.length} γράμματα)</span></label><input type="text" id="a${i}" data-i="${i}" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>`).join("")}<div class="acrow hid"><label for="ahid"><b>🔑 Η κρυμμένη λέξη είναι:</b></label><input type="text" id="ahid" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><p class="hintline">Δεν χρειάζονται τόνοι.</p>`; }
  else if(T === "open"){ const q = EQN[it.n]; st.v = "";
    html = `${it.noQ ? "" : `<p class="qtext">${esc(q.q)}</p>`}<p class="hintline">Γράψε την απάντηση με δικά σου λόγια ή με τα λόγια του βιβλίου.</p><textarea id="ta" rows="6" placeholder="Γράψε εδώ…"></textarea>`; }
  h.innerHTML = html + `<div id="fbx"></div><div class="actions"></div>`;
  const act = h.querySelector(".actions");
  const snap = () => ({v: st.v, sel: st.sel ? [...st.sel] : undefined, seq: st.seq, pool: st.pool, hid: st.hid});
  const changed = () => { if(o.onChange) o.onChange(snap()); ready(); };
  const isReady = () => {
    if(T === "tf" || T === "mc") return st.v !== null;
    if(T === "pick") return st.sel.size > 0;
    if(T === "match" || T === "cloze") return st.v.every(v => v);
    if(T === "ctype") return st.v.some(v => v.trim());
    if(T === "order") return st.seq.length === it.ev.length;
    if(T === "acro") return st.v.some(v => v.trim());
    if(T === "open") return st.v.trim().length >= 3;
    return false;
  };
  const ready = () => { const c = act.querySelector("#chk"); if(c) c.disabled = !isReady(); };
  /* bind */
  if(T === "tf" || T === "mc") h.querySelectorAll(".opt").forEach(b => b.onclick = () => { if(st.checked) return; h.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); st.v = T === "tf" ? b.dataset.v === "1" : +b.dataset.i; changed(); });
  const markPick = (b, on) => { b.classList.toggle("sel", on); b.querySelector("b").textContent = on ? "✔" : "☐"; };
  if(T === "pick") h.querySelectorAll(".opt").forEach(b => b.onclick = () => { if(st.checked) return; const i = +b.dataset.i; if(st.sel.has(i)){ st.sel.delete(i); markPick(b, false); } else { st.sel.add(i); markPick(b, true); } changed(); });
  if(T === "match") h.querySelectorAll("select").forEach(s => s.onchange = () => { st.v[+s.dataset.i] = s.value; changed(); });
  if(T === "cloze") h.querySelectorAll("select.bl").forEach(s => s.onchange = () => { st.v[+s.dataset.b] = s.value; changed(); });
  if(T === "ctype"){ const ins = [...h.querySelectorAll("input.cb")]; ins.forEach((inp, k) => { inp.oninput = () => { st.v[+inp.dataset.b] = inp.value; changed(); }; inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); if(ins[k + 1]) ins[k + 1].focus(); } }; }); }
  const draw = () => {
    h.querySelector("#seq").innerHTML = st.seq.map((i, k) => `<button class="chipbtn" data-i="${i}"><span>${k + 1}.</span>${esc(it.ev[i].t)}</button>`).join("");
    h.querySelector("#pool").innerHTML = st.pool.filter(i => !st.seq.includes(i)).map(i => `<button class="chipbtn" data-i="${i}">${esc(it.ev[i].t)}</button>`).join("");
    h.querySelectorAll("#seq .chipbtn").forEach(b => b.onclick = () => { if(st.checked) return; st.seq = st.seq.filter(x => x !== +b.dataset.i); draw(); changed(); });
    h.querySelectorAll("#pool .chipbtn").forEach(b => b.onclick = () => { if(st.checked) return; st.seq.push(+b.dataset.i); draw(); changed(); });
  };
  const drawGrid = () => { h.querySelector("#ag").innerHTML = acroGrid(it, st.v.map(upL)); };
  if(T === "acro"){ h.querySelectorAll(".acrow input[data-i]").forEach(inp => { inp.oninput = () => { st.v[+inp.dataset.i] = inp.value; drawGrid(); changed(); }; inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); const nx = h.querySelector("#a" + (+inp.dataset.i + 1)) || h.querySelector("#ahid"); if(nx) nx.focus(); } }; });
    h.querySelector("#ahid").oninput = e => { st.hid = e.target.value; changed(); }; }
  if(T === "open"){ const ta = h.querySelector("#ta"); ta.oninput = () => { st.v = ta.value; changed(); }; }

  /* επαναφορά όσων είχε γράψει/διαλέξει */
  const sv = o.saved;
  if(sv){
    if(T === "tf" && sv.v !== null && sv.v !== undefined){ st.v = sv.v; const b = h.querySelector(`.opt[data-v="${sv.v ? 1 : 0}"]`); if(b) b.classList.add("sel"); }
    if(T === "mc" && sv.v !== null && sv.v !== undefined){ st.v = sv.v; const b = h.querySelector(`.opt[data-i="${sv.v}"]`); if(b) b.classList.add("sel"); }
    if(T === "pick" && sv.sel){ sv.sel.forEach(i => { st.sel.add(i); const b = h.querySelector(`.opt[data-i="${i}"]`); if(b) markPick(b, true); }); }
    if(T === "match" && sv.v){ st.v = sv.v.slice(); h.querySelectorAll("select").forEach(s => s.value = st.v[+s.dataset.i] || ""); }
    if(T === "cloze" && sv.v){ st.v = sv.v.slice(); h.querySelectorAll("select.bl").forEach(s => s.value = st.v[+s.dataset.b] || ""); }
    if(T === "ctype" && sv.v){ st.v = sv.v.slice(); h.querySelectorAll("input.cb").forEach(inp => inp.value = st.v[+inp.dataset.b] || ""); }
    if(T === "order"){ if(sv.pool) st.pool = sv.pool.slice(); if(sv.seq) st.seq = sv.seq.slice(); }
    if(T === "acro" && sv.v){ st.v = sv.v.slice(); st.hid = sv.hid || ""; h.querySelectorAll(".acrow input[data-i]").forEach(inp => inp.value = st.v[+inp.dataset.i] || ""); h.querySelector("#ahid").value = st.hid; drawGrid(); }
    if(T === "open" && typeof sv.v === "string"){ st.v = sv.v; h.querySelector("#ta").value = sv.v; }
  }
  if(T === "order") draw();

  const showChecked = (r, extra) => {
    h.querySelector("#fbx").innerHTML = r.fb + (extra || "") + (r.more || "");
    const lab = typeof o.nextLabel === "function" ? o.nextLabel() : (o.nextLabel || "Επόμενη →");
    act.innerHTML = navRow({prev: o.prev, main: {label: lab, id: "nxt", fn: o.next}});
    bindNav(act, {prev: o.prev, main: {id: "nxt", fn: o.next}});
  };
  if(o.checked){ st.checked = true; const r = grade(it, st, h); showChecked(r, o.extra); return; }

  act.innerHTML = navRow({prev: o.prev, skip: o.next, skipLabel: o.skipLabel || "Επόμενη →", main: {label: "Έλεγχος ✓", id: "chk", disabled: true}});
  bindNav(act, {prev: o.prev, skip: o.next});
  ready();
  act.querySelector("#chk").onclick = () => {
    const c = act.querySelector("#chk"); if(st.checked || c.disabled) return; st.checked = true;
    const r = grade(it, st, h);
    const extra = o.onChecked ? (o.onChecked(r, snap()) || "") : "";
    showChecked(r, extra);
    try{ h.querySelector("#fbx").scrollIntoView({behavior:"smooth", block:"nearest"}); }catch(e){}
  };
}

function head(cls, title, body){ return `<div class="fb ${cls}"><strong>${title}</strong>${body || ""}</div>`; }
function verdict(score){ return score >= 0.999 ? ["ok", pick1(PRAISE) + " 🎉"] : score >= 0.5 ? ["part", "Σχεδόν! 💪"] : ["no", "Όχι ακριβώς 🙂"]; }

/* βαθμολόγηση + χρωματισμός απαντήσεων */
function grade(it, st, h){
  const T = it.t, max = maxPts(it); let score = 0, fb = "", right = "";
  h.querySelectorAll("button.opt, select, input, textarea").forEach(x => x.disabled = true);
  if(T === "tf"){
    score = st.v === it.ans ? 1 : 0;
    h.querySelectorAll(".opt").forEach(b => { const v = b.dataset.v === "1"; if(v === it.ans) b.classList.add("ok"); else if(b.classList.contains("sel")) b.classList.add("no"); });
    right = it.ans ? "Σωστό" : "Λάθος · Το σωστό: " + it.fix;
    const body = it.ans ? (it.e ? `<p>${esc(it.e)}</p>` : "") : `<p>Η πρόταση είναι <b>λάθος</b>. Το σωστό: <b>${esc(it.fix)}</b></p>${it.e ? `<p>${esc(it.e)}</p>` : ""}`;
    const [c, t] = verdict(score); fb = head(c, t, body);
  }
  else if(T === "mc"){
    score = st.v === it.a ? 1 : 0;
    h.querySelectorAll(".opt").forEach(b => { const i = +b.dataset.i; if(i === it.a) b.classList.add("ok"); else if(i === st.v) b.classList.add("no"); });
    right = it.opts[it.a]; const [c, t] = verdict(score);
    fb = head(c, t, score ? "" : `<p>Σωστή απάντηση: <b>${esc(right)}</b></p>`);
  }
  else if(T === "pick"){
    const nOk = it.opts.filter(x => x.ok).length; let tp = 0, fp = 0;
    it.opts.forEach((x, i) => { if(st.sel.has(i)){ if(x.ok) tp++; else fp++; } });
    score = Math.max(0, (tp - fp) / nOk);
    h.querySelectorAll(".opt").forEach(b => { const i = +b.dataset.i, x = it.opts[i]; if(x.ok && st.sel.has(i)) b.classList.add("ok"); else if(!x.ok && st.sel.has(i)) b.classList.add("no"); else if(x.ok) b.classList.add("miss"); });
    right = it.opts.filter(x => x.ok).map(x => x.s).join(" · ");
    const [c, t] = verdict(score);
    fb = head(c, t, score >= 0.999 ? "" : `<p>Βρήκες <b>${tp}</b> από τα <b>${nOk}</b> σωστά${fp ? ` και διάλεξες <b>${fp}</b> λάθος` : ""}. Τα σωστά έχουν πράσινο περίγραμμα.</p>`);
  }
  else if(T === "match"){
    let n = 0; it.rows.forEach((r, i) => { const row = h.querySelector(`.matchrow[data-i="${i}"]`); const ok = st.v[i] === r.v; if(ok) n++; row.classList.add(ok ? "ok" : "no"); if(!ok) row.insertAdjacentHTML("beforeend", `<span class="fix" style="grid-column:1/-1">✔ ${esc(r.k)} → ${esc(r.v)}</span>`); });
    score = n / it.rows.length; right = it.rows.map(r => r.k + " → " + r.v).join(" · ");
    const [c, t] = verdict(score); fb = head(c, t, `<p>Σωστά ταιριάσματα: <b>${n}</b> από <b>${it.rows.length}</b>.</p>`);
  }
  else if(T === "cloze"){
    let n = 0; h.querySelectorAll("select.bl").forEach(s => { const b = +s.dataset.b, ok = st.v[b] === it.blanks[b]; if(ok) n++; s.classList.add(ok ? "ok" : "no"); if(!ok) s.insertAdjacentHTML("afterend", ` <b class="fix" style="display:inline">${esc(it.blanks[b])}</b>`); });
    score = n / it.blanks.length; right = it.sents.map(s => s.map(g => typeof g === "string" ? g : it.blanks[g.b]).join("")).join(" ");
    const [c, t] = verdict(score); fb = head(c, t, `<p>Σωστά κενά: <b>${n}</b> από <b>${it.blanks.length}</b>.</p>`);
  }
  else if(T === "ctype"){
    let n = 0, spell = []; h.querySelectorAll("input.cb").forEach(inp => { const b = +inp.dataset.b, tgt = it.blanks[b], ok = near(st.v[b], tgt); if(ok){ n++; if(!exact(st.v[b], tgt)) spell.push(tgt); } inp.classList.add(ok ? "ok" : "no"); if(!ok || !exact(st.v[b], tgt)) inp.insertAdjacentHTML("afterend", ` <b class="fix" style="display:inline">${esc(tgt)}</b>`); });
    score = n / it.blanks.length; right = it.seg.map(g => typeof g === "string" ? g : it.blanks[g.b]).join("");
    const [c, t] = verdict(score);
    fb = head(c, t, `<p>Σωστές λέξεις: <b>${n}</b> από <b>${it.blanks.length}</b>.</p>${spell.length ? `<p>👀 Πρόσεξε πώς γράφονται: <b>${spell.map(esc).join(", ")}</b></p>` : ""}`);
  }
  else if(T === "order"){
    let n = 0; st.seq.forEach((ix, k) => { if(ix === k) n++; });
    score = n / it.ev.length; right = it.ev.map(e => e.t + " (" + e.lab + ")").join(" → ");
    h.querySelector("#seq").classList.add(score >= 0.999 ? "ok" : "no");
    const [c, t] = verdict(score);
    fb = head(c, t, `<p>Στη σωστή θέση: <b>${n}</b> από <b>${it.ev.length}</b>. Η σωστή σειρά:</p><ol class="right">${it.ev.map(e => `<li>${esc(e.t)} <span class="note2">(${esc(e.lab)})</span></li>`).join("")}</ol>`);
  }
  else if(T === "acro"){
    let n = 0; it.rows.forEach((r, i) => { const inp = h.querySelector("#a" + i), ok = near(st.v[i], r.w); if(ok) n++; inp.classList.add(ok ? "ok" : "no"); if(!ok || !exact(st.v[i], r.w)) inp.insertAdjacentHTML("afterend", `<span class="fix">✔ ${esc(r.w)}</span>`); });
    const hok = near(st.hid, it.hidden); if(hok) n++; const hi = h.querySelector("#ahid"); hi.classList.add(hok ? "ok" : "no");
    h.querySelector("#ag").innerHTML = acroGrid(it, it.rows.map(r => [...r.w]));
    score = n / (it.rows.length + 1); right = it.rows.map(r => r.w).join(", ") + " → " + it.hidden;
    const [c, t] = verdict(score);
    fb = head(c, t, `<p>Σωστές λέξεις: <b>${n}</b> από <b>${it.rows.length + 1}</b>. Η κρυμμένη λέξη είναι <b>${esc(it.hidden)}</b>. ${esc(it.info)}</p>`);
  }
  else if(T === "open"){
    const q = EQN[it.n], found = keyFound(q, st.v), nf = found.filter(Boolean).length;
    const mustOk = q.keys.every((g, i) => !g.must || found[i]);
    const pass = nf >= q.need && mustOk;
    score = Math.min(1, nf / q.need); if(!mustOk) score = Math.min(score, 0.5);
    right = q.short;
    const [c, t] = pass ? ["ok", pick1(PRAISE) + " 🎉"] : nf >= Math.ceil(q.need / 2) ? ["part", "Καλή αρχή! 💪"] : ["no", "Ας τη δούμε μαζί 🙂"];
    fb = head(c, t, `<p>Έγραψες <b>${nf}</b> από τα <b>${q.keys.length}</b> βασικά σημεία${pass ? "." : ` · για πλήρη απάντηση χρειάζονται τουλάχιστον <b>${q.need}</b>${mustOk ? "" : " και τα σημεία με ⭐"}.`}</p><div class="keys">${q.keys.map((g, i) => `<span class="${found[i] ? "kok" : "kno"}">${found[i] ? "✔" : "✘"} ${g.must ? "⭐ " : ""}${esc(g.d)}</span>`).join("")}</div>`);
    const more = answerBox(q, "📖 Η απάντηση") + (q.op ? `<div class="opin"><b>💭 Η γνώμη σου</b><p>${esc(q.op)}</p></div>` : "");
    return {score, pts: score * max, max, pass, fb, more, right};
  }
  return {score, pts: score * max, max, pass: score >= (it.passAt || 1) - 1e-9, fb, right};
}

/* ===================== ΜΑΘΕ ΤΙΣ 15 ===================== */
const STEP = ["Βρες τη σωστή απάντηση", "Διάλεξε τα σωστά", "Συμπλήρωσε τις λέξεις", "Γράψ’ την μόνη σου"];
function renderLearnHome(){
  setColor(null); window.scrollTo(0, 0);
  const st = learnStars(); const done = EQ.filter(q => (st[q.n] || 0) >= 4).length; const tot = EQ.reduce((a, q) => a + Math.min(4, st[q.n] || 0), 0);

    <p class="hintline">Αν κάνεις λάθος χάνεις ένα αστέρι, αλλά η ερώτηση ξανάρχεται για να το κερδίσεις πάλι. Μπορείς να πας μπρος-πίσω όποτε θέλεις.</p>

    ${done < 15 ? `<button class="btn" id="round">▶ Ξεκίνα γύρο (5 ερωτήσεις)</button>` : `<p class="starmsg win">🏆 Τις ξέρεις όλες! Κάνε τώρα μια πρόβα διαγωνίσματος.</p>`}
    <div class="eqgrid">${EQ.map(q => { const s = st[q.n] || 0; return `<button class="eqc${s >= 4 ? " done" : ""}" data-n="${q.n}" style="--c:${L[q.l].col};--c-soft:${L[q.l].soft}"><b>${q.n}</b><span>${esc(q.title)}</span><i>${starStr(s)}</i></button>`; }).join("")}</div>
    <p class="hintline">Πάτα μια ερώτηση για να εξασκηθείς μόνο σε αυτή.</p>
    ${tot > 0 ? `<button class="btn ghost sm" id="reset">↺ Μηδένισε τα αστέρια</button>` : ""}
  </div>`;
  const r = $("#round"); if(r) r.onclick = () => startLearn(nextFive());
  view.querySelectorAll(".eqc").forEach(b => b.onclick = () => startLearn([+b.dataset.n]));
  const rs = $("#reset"); if(rs) rs.onclick = () => { if(rs.dataset.sure){ store(LSL, {}); renderLearnHome(); } else { rs.dataset.sure = "1"; rs.textContent = "Σίγουρα; Πάτα ξανά για μηδενισμό"; } };
}
function nextFive(){ const st = learnStars(); return EQ.filter(q => (st[q.n] || 0) < 4).sort((a, b) => (st[a.n] || 0) - (st[b.n] || 0) || a.n - b.n).slice(0, 5).map(q => q.n); }
function makeLearnItem(q, lvl){
  if(lvl === 0){ const opts = shuffle([q.rec.a, ...q.rec.w]); return {t:"mc", q:"Ποια είναι η σωστή απάντηση;", opts, a: opts.indexOf(q.rec.a)}; }
  if(lvl === 1){
    if(q.m){ const rows = shuffle(q.m.rows); return {t:"match", q: q.m.q, rows, opts: q.m.opts ? q.m.opts.slice() : shuffle(rows.map(r => r.v)), passAt: 0.8}; }
    const opts = shuffle([...q.p.ok.map(s => ({s, ok:true})), ...sample(q.p.no, Math.min(3, q.p.no.length)).map(s => ({s, ok:false}))]);
    return {t:"pick", q: q.p.q, opts, passAt: 1};
  }
  if(lvl === 2){ const {seg, ans} = parseBl(q.ct); return {t:"ctype", seg, blanks: ans, passAt: 0.75}; }
  return {t:"open", n: q.n, noQ: true};
}
function learnPos(n, tries){ const lvl = Math.min(3, learnStars()[n] || 0); return {n, lvl, tries: tries || 0, read: lvl > 0 || !!tries, item: makeLearnItem(EQN[n], lvl)}; }
function startLearn(ns){ S = {mode:"learn", items: ns.map(n => learnPos(n)), idx: 0, res: [], drafts: [], gained: 0, lost: 0}; renderPos(); }

/* ===================== ΚΟΙΝΗ ΟΘΟΝΗ ΓΙΑ ΜΑΘΕ / ΠΡΟΒΑ / ΓΡΗΓΟΡΗ ===================== */
function startSet(kind, items, lk){ S = {mode: kind, items, idx: 0, res: [], drafts: [], lk: lk || null}; saveS(); renderPos(); }
let saveTimer = null;
function saveS(){ if(S && S.mode === "prova"){ clearTimeout(saveTimer); saveTimer = setTimeout(() => store(LSP, S), 250); } }
function goPos(j){ S.idx = Math.max(0, Math.min(S.items.length - 1, j)); saveS(); renderPos(); }
function dotsHTML(){
  return `<div class="dots" role="navigation" aria-label="Ερωτήσεις">${S.items.map((_, i) => { const r = S.res[i]; let c = r ? (r.score >= 0.999 ? "d-ok" : r.score >= 0.5 ? "d-part" : "d-no") : (S.drafts[i] ? "d-draft" : ""); if(i === S.idx) c += " cur"; return `<button class="dot ${c}" data-j="${i}" aria-label="Ερώτηση ${i + 1}">${i + 1}</button>`; }).join("")}</div>`;
}
function renderPos(){
  window.scrollTo(0, 0);
  const LM = S.mode === "learn", P = S.mode === "prova";
  const pos = LM ? S.items[S.idx] : null;
  const it = LM ? pos.item : S.items[S.idx];
  const prev = S.idx > 0 ? () => goPos(S.idx - 1) : null;
  const isLast = () => S.idx === S.items.length - 1;
  const next = () => isLast() ? finishCheck() : goPos(S.idx + 1);
  const nextLabel = () => isLast() ? (LM ? "Τέλος γύρου →" : "Δες το αποτέλεσμα →") : "Επόμενη →";
  let tag, right;
  if(LM){ const q = EQN[pos.n]; setColor(L[q.l]); tag = `Ερώτηση ${q.n} · Βήμα ${pos.lvl + 1}: ${STEP[pos.lvl]}`; right = `<span class="stars" title="αστέρια">${starStr(learnStars()[q.n] || 0)}</span>`; }
  else { setColor(P || !S.lk || S.lk === "all" ? null : L[S.lk]); const secs = SECORD.filter(k => S.items.some(x => x.sec === k)); tag = P ? `Θέμα ${secs.indexOf(it.sec) + 1} · ${SECS[it.sec]}` : SECS[it.sec]; right = `<span>${S.idx + 1} / ${S.items.length}</span>`; }
  view.innerHTML = `<div class="card stack">
    <div class="qhead"><span class="tag">${tag}</span>${right}</div>
    ${dotsHTML()}
    ${LM ? `<div class="eqbox"><p class="eqq">${esc(EQN[pos.n].q)}</p></div>` : ""}
    <div id="host" class="stack"></div>
  </div>
  <div class="row between" style="margin-top:12px">${LM ? `<button class="btn ghost sm" data-learnhome>← Όλες οι ερωτήσεις</button>` : `<button class="btn ghost sm" data-home>${P ? "⏸ Σταμάτα (συνεχίζεις μετά)" : "✕ Τέλος"}</button>`}</div>`;
  view.querySelectorAll(".dot").forEach(b => b.onclick = () => goPos(+b.dataset.j));
  const host = $("#host");
  if(LM && !pos.read && !S.res[S.idx]){
    const q = EQN[pos.n];
    host.innerHTML = `<div class="ans"><b class="at">📖 Διάβασε πρώτα την απάντηση</b><p class="big">${esc(q.short)}</p></div><div class="actions">${navRow({prev, skip: next, skipLabel: nextLabel(), main: {label: "Τη διάβασα! Πάμε →", id: "readok"}})}</div>`;
    bindNav(host, {prev, skip: next, main: {id: "readok", fn: () => { pos.read = true; renderPos(); }}});
    return;
  }
  const done = S.res[S.idx];
  runItem(it, {host, saved: S.drafts[S.idx], checked: !!done, extra: done ? done.extra : "",
    prev, next, nextLabel, skipLabel: nextLabel(),
    onChange: d => { S.drafts[S.idx] = d; saveS(); },
    onChecked: (r, d) => {
      S.drafts[S.idx] = d;
      let extra = "";
      if(LM){
        const q = EQN[pos.n], now = learnStars()[q.n] || 0;
        if(r.pass){ const nv = Math.min(4, now + 1); setStar(q.n, nv); S.gained++;
          extra = nv >= 4 ? `<div class="starmsg win">🏆 Την ξέρεις! 4 αστέρια στην ερώτηση ${q.n}</div>` : `<div class="starmsg">⭐ +1 αστέρι! ${starStr(nv)}</div>`; }
        else { const nv = Math.max(0, now - 1); setStar(q.n, nv); S.lost++;
          if(pos.tries < 2) S.items.push(learnPos(q.n, pos.tries + 1));
          extra = `<div class="starmsg lose">${now > 0 ? "−1 αστέρι · " : ""}${pos.tries < 2 ? "θα την ξαναδείς στο τέλος του γύρου 💪" : "θα την ξαναδούμε σε άλλο γύρο 💪"}</div>`; }
        if(it.t !== "open") extra += answerBox(q);
        const qh = view.querySelector(".qhead .stars"); if(qh) qh.textContent = starStr(learnStars()[q.n] || 0);
      }
      S.res[S.idx] = {pts: r.pts, max: r.max, score: r.score, sec: it.sec, l: it.l, q: promptOf(it), right: r.right, extra};
      saveS();
      /* ανανέωση αριθμών και του κουμπιού «Επόμενη» (μπορεί να μπήκε νέα ερώτηση στο τέλος) */
      const dw = view.querySelector(".dots"); if(dw){ dw.outerHTML = dotsHTML(); view.querySelectorAll(".dot").forEach(b => b.onclick = () => goPos(+b.dataset.j)); }
      return extra;
    }
  });
}
function finishCheck(){
  const left = S.items.map((_, i) => i).filter(i => !S.res[i]);
  if(left.length) return askUnanswered(left);
  return S.mode === "learn" ? learnSummary() : finishSet();
}
function askUnanswered(left){
  const LM = S.mode === "learn";
  const host = $("#host");
  const box = document.createElement("div");
  box.className = "fb part";
  box.innerHTML = `<strong>Έμειναν ${left.length} ${left.length === 1 ? "ερώτηση" : "ερωτήσεις"} χωρίς απάντηση</strong><p>Οι αριθμοί χωρίς χρώμα πάνω πάνω είναι αυτές που δεν απάντησες.</p><div class="row"><button class="btn" id="gofirst">Πήγαινε στην ερώτηση ${left[0] + 1}</button><button class="btn ghost" id="finnow">${LM ? "Τέλος γύρου" : "Δες το αποτέλεσμα"} έτσι κι αλλιώς</button></div>`;
  const old = host.querySelector(".ask"); if(old) old.remove();
  box.classList.add("ask"); host.appendChild(box);
  box.querySelector("#gofirst").onclick = () => goPos(left[0]);
  box.querySelector("#finnow").onclick = () => LM ? learnSummary() : finishSet();
  try{ box.scrollIntoView({behavior:"smooth", block:"nearest"}); }catch(e){}
}
function learnSummary(){
  setColor(null); window.scrollTo(0, 0); const st = learnStars(); const ns = [...new Set(S.items.map(p => p.n))];
  view.innerHTML = `<div class="card stack" style="text-align:center">
    <h2>Τέλος γύρου! 🎉</h2>
    <p class="hello">Κέρδισες <b>${S.gained}</b> ${S.gained === 1 ? "αστέρι" : "αστέρια"}.</p>
    <div class="stack" style="text-align:left">${ns.map(n => `<div class="row between"><span><b>${n}.</b> ${esc(EQN[n].title)}</span><span class="stars">${starStr(st[n] || 0)}</span></div>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="back">← Γύρνα στον γύρο</button><button class="btn" id="again">▶ Επόμενος γύρος</button><button class="btn ghost" data-learnhome>Όλες οι ερωτήσεις</button></div>
  </div>`;
  $("#back").onclick = () => renderPos();
  $("#again").onclick = () => { const left = nextFive(); if(left.length) startLearn(left); else renderLearnHome(); };
}

function bar(label, v){ const col = v >= 80 ? "#1f9e5a" : v >= 50 ? "#f0a020" : "#e5484d"; return `<div class="barrow"><span>${label}</span><div class="tr"><i style="width:${Math.max(3, v)}%;background:${col}"></i></div><b>${v}%</b></div>`; }
function finishSet(){
  const P = S.mode === "prova"; setColor(null); window.scrollTo(0, 0);
  const all = S.items.map((it, i) => S.res[i] || {pts: 0, max: maxPts(it), score: 0, sec: it.sec, l: it.l, q: promptOf(it), right: "", skipped: true});
  const tot = all.reduce((a, r) => a + r.pts, 0), max = all.reduce((a, r) => a + r.max, 0);
  const pct = max ? Math.round(tot / max * 100) : 0;
  const skipped = all.filter(r => r.skipped).length;
  const hist = load(LSH, []); hist.push({ts: Date.now(), kind: S.mode, pct, lk: S.lk}); store(LSH, hist.slice(-40));
  if(P){ clearTimeout(saveTimer); store(LSP); }
  const res = all;
  const per = (key, keys, name) => keys.map(k => { const rs = res.filter(r => r[key] === k); if(!rs.length) return ""; const p = Math.round(rs.reduce((a, r) => a + r.pts, 0) / rs.reduce((a, r) => a + r.max, 0) * 100); return bar(name(k), p); }).join("");
  const lessonPct = Object.keys(L).map(k => { const rs = res.filter(r => r.l === k); if(!rs.length) return null; return {k, p: Math.round(rs.reduce((a, r) => a + r.pts, 0) / rs.reduce((a, r) => a + r.max, 0) * 100)}; }).filter(Boolean);
  const weak = lessonPct.filter(x => x.p < 70);
  const msg = pct >= 90 ? "Είσαι έτοιμη για το διαγώνισμα! 🏆" : pct >= 75 ? "Πολύ καλά! Λίγη επανάληψη ακόμα 💪" : pct >= 50 ? "Καλή αρχή! Δες τα λάθη σου και ξαναδοκίμασε 🌱" : "Ας τα ξαναδούμε μαζί! Δοκίμασε το «Μάθε τις 15 ερωτήσεις» 📖";
  const wrong = res.filter(r => !r.skipped && r.score < 0.999);
  view.innerHTML = `<div class="card stack">
    <h2>${P ? "📝 Αποτέλεσμα πρόβας" : "⚡ Αποτέλεσμα"}</h2>
    <div class="score"><span class="big">${pct}%</span><p class="hello">${msg}</p></div>
    ${skipped ? `<p class="hintline">${skipped} ${skipped === 1 ? "ερώτηση έμεινε" : "ερωτήσεις έμειναν"} χωρίς απάντηση και ${skipped === 1 ? "μετράει" : "μετράνε"} μηδέν.</p>` : ""}
    ${P ? `<h3>Ανά θέμα</h3><div class="bars">${per("sec", SECORD, k => SECS[k])}</div>` : ""}
    ${lessonPct.length > 1 ? `<h3>Ανά μάθημα</h3><div class="bars">${lessonPct.map(x => bar(L[x.k].n, x.p)).join("")}</div>` : ""}
    ${weak.length ? `<p>📖 Ξαναδιάβασε: <b>${weak.map(x => L[x.k].n + " (" + L[x.k].name + ")").join(", ")}</b></p>` : ""}
    <div class="row"><button class="btn" id="again">${P ? "📝 Νέα πρόβα" : "⚡ Ξανά"}</button><button class="btn ghost" data-home>Αρχική</button></div>
  </div>
  ${wrong.length ? `<div class="gap"></div><div class="card stack"><h2>🔍 Δες τα λάθη σου (${wrong.length})</h2>${wrong.map(r => `<div class="mist"><div class="q">${esc(r.q)}</div><div class="r">✔ ${esc(r.right)}</div></div>`).join("")}</div>` : ""}`;
  const kind = S.mode, lk = S.lk;
  $("#again").onclick = () => kind === "prova" ? startSet("prova", genProva()) : startSet("quick", genQuick(lk), lk);
}
function renderQuickPick(){
  setColor(null); window.scrollTo(0, 0);
  view.innerHTML = `<div class="card stack">
    <div class="row between"><h2>⚡ Γρήγορη εξάσκηση</h2><button class="btn ghost sm" data-home>← Αρχική</button></div>
    <p>Διάλεξε μάθημα:</p>
    <div class="lgrid">${Object.keys(L).map(k => `<button class="lbtn" data-l="${k}" style="--c:${L[k].col};--c-soft:${L[k].soft}"><b>${L[k].n}</b><span>${esc(L[k].name)}</span></button>`).join("")}
      <button class="lbtn" data-l="all"><b>Όλα μαζί 🎲</b><span>Ανακάτεμα από όλα τα μαθήματα</span></button></div>
  </div>`;
  view.querySelectorAll(".lbtn").forEach(b => b.onclick = () => startSet("quick", genQuick(b.dataset.l), b.dataset.l));
}

/* ===================== ΚΑΡΤΕΣ ===================== */
function renderCard(i, shown){
  window.scrollTo(0, 0);
  const q = EQ[i]; setColor(L[q.l]);
  view.innerHTML = `<div class="card stack">
    <div class="qhead"><span class="tag">Ερώτηση ${q.n} από 15 · σελ. ${q.pg}</span><button class="btn ghost sm" data-home>✕</button></div>
    <div class="dots">${EQ.map((x, j) => `<button class="dot${j === i ? " cur" : ""}" data-j="${j}" aria-label="Ερώτηση ${j + 1}">${j + 1}</button>`).join("")}</div>
    <div class="eqbox"><p class="eqq">${esc(q.q)}</p></div>
    ${shown ? `<div class="ans"><b class="at">📖 Η απάντηση με λίγα λόγια</b><p class="big">${esc(q.short)}</p></div>
      ${q.op ? `<div class="opin"><b>💭 Η γνώμη σου</b><p>${esc(q.op)}</p></div>` : ""}
      <details><summary>📘 Τα λόγια του βιβλίου</summary><div class="book">${bookHTML(q)}</div></details>`
      : `<p class="hintline">Σκέψου την απάντηση (ή πες την δυνατά) και μετά πάτα το κουμπί.</p><button class="btn" id="show">👀 Δείξε την απάντηση</button>`}
    <div class="row navrow"><button class="btn ghost" id="prev" ${i ? "" : "disabled"}>← Προηγούμενη</button><span class="sp"></span><button class="btn ghost" id="next">${i < EQ.length - 1 ? "Επόμενη →" : "Τέλος ✓"}</button></div>
  </div>`;
  view.querySelectorAll(".dot").forEach(b => b.onclick = () => renderCard(+b.dataset.j, false));
  const sh = $("#show"); if(sh) sh.onclick = () => renderCard(i, true);
  $("#prev").onclick = () => renderCard(Math.max(0, i - 1), false);
  $("#next").onclick = () => i < EQ.length - 1 ? renderCard(i + 1, false) : renderHome();
}

renderHome();

</script>
</body>
