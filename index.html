<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"></head><body>
<title>Κουίζ Υλικών Σωμάτων</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Commissioner:wght@400;600;700&display=swap">
<style>
/* Layout: one centred question card at a time (kid-sized type and buttons); results = score + coloured bar per lesson + "what to fix" cards.
   Deliberately one bright light look for a 10-year-old; each lesson (concept) has its own colour. */
:root{
  --bg:#f1f7fb;
  --card:#ffffff;
  --soft:#eef4f9;
  --line:#d4e2ec;
  --fg:#1d2b36;
  --muted:#5a6d7a;
  --brand:#ff6b4a;
  --brand-soft:#ffe7e0;
  --good:#1f9e5a; --good-soft:#dff5e8;
  --bad:#d93a2b;  --bad-soft:#fde5e2;
  --mid:#d98a00;  --mid-soft:#fff1d6;
  --c:#ff6b4a; --c-soft:#ffe7e0;   /* current lesson colour, set from JS */
  --f-display:"Comfortaa","Commissioner",system-ui,sans-serif;
  --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px;line-height:1.2}
h3{font-size:18px}
p{margin:8px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{font-family:var(--f-display);font-weight:700;color:var(--brand);font-size:15px}
.save{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 2px 12px rgba(29,43,54,.06)}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{appearance:none;border:2px solid transparent;background:var(--brand);color:#fff;font:700 17px var(--f-body);padding:12px 20px;border-radius:14px;cursor:pointer;min-height:50px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--card);color:var(--fg);border-color:var(--line)}
.btn.c{background:var(--c)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn:focus-visible,.opt:focus-visible,.chipbtn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #2d7ff9;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
label.lbl{font-weight:600;display:block;margin-bottom:6px}
input[type=text],input[type=number],select{font:600 18px var(--f-body);padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--fg);min-height:48px}
input[type=text]{width:100%;max-width:340px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
/* progress */
.prog{height:12px;background:var(--soft);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .3s}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:10px 0 2px}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--c-soft);color:var(--c)}
.qtext{font-size:21px;font-weight:600;line-height:1.4;margin:10px 0 6px}
.qtext .gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--c);margin:0 4px;transform:translateY(-4px)}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{appearance:none;text-align:left;border:2px solid var(--line);background:#fff;color:var(--fg);font:600 18px var(--f-body);padding:12px 16px;border-radius:14px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:54px}
.opt b{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);font-size:15px}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.sel{border-color:var(--c);background:var(--c-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:20px}
.matchrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.matchrow select{width:100%}
.matchrow .k{font-weight:700;font-size:18px}
.matchrow.ok select{border-color:var(--good);background:var(--good-soft)}
.matchrow.no select{border-color:var(--bad);background:var(--bad-soft)}
.pool,.seq{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:14px}
.pool{background:var(--soft)}
.seq{border:2px dashed var(--c);background:#fff}
.chipbtn{appearance:none;border:2px solid var(--c);background:#fff;color:var(--fg);font:700 17px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.seq .chipbtn{background:var(--c-soft)}
.seq .chipbtn span{color:var(--c);margin-right:6px}
.seq.ok{border-color:var(--good)} .seq.no{border-color:var(--bad)}
.hintline{font-size:14px;color:var(--muted)}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:16px}
.fb.ok{background:var(--good-soft);border:2px solid var(--good)}
.fb.no{background:var(--bad-soft);border:2px solid var(--bad)}
.fb.part{background:var(--mid-soft);border:2px solid var(--mid)}
.fb strong{display:block;font-family:var(--f-display);font-size:18px;margin-bottom:2px}
.fig{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:6px 0}
.fig svg{max-width:100%;height:auto}
.unitbox{display:flex;align-items:center;gap:10px}
.unitbox input{width:150px}
.unitbox span{font-weight:700;font-size:18px}
/* results */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--soft) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring div{width:92px;height:92px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.ring small{font-size:12px;color:var(--muted);font-family:var(--f-body)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bar .name{font-weight:700}
.bar .val{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .track{grid-column:1/-1;height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:999px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:1px}
.b-good{background:var(--good-soft);color:var(--good)} .b-mid{background:var(--mid-soft);color:#9a6200} .b-bad{background:var(--bad-soft);color:var(--bad)}
.mis{display:flex;flex-direction:column;gap:10px}
.mis .m{border-radius:14px;padding:12px 14px;background:var(--soft);border-left:6px solid var(--c)}
.mis .m .no{color:var(--bad);font-weight:700}
.mis .m .yes{color:var(--good);font-weight:700}
.theory{background:var(--c-soft);border:2px solid var(--c);border-radius:16px;padding:14px 16px}
.theory h3{color:var(--c)}
.theory ul{margin:8px 0 0;padding-left:20px}.theory li{margin:4px 0}
details{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px 14px}
summary{cursor:pointer;font-weight:700}
table.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.hist th,table.hist td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.hist th{color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.review{display:flex;flex-direction:column;gap:8px}
.review .r{font-size:15px;border-bottom:1px dashed var(--line);padding:6px 0}
.review .r em{font-style:normal;color:var(--bad);font-weight:700}
.review .r b{color:var(--good)}
.cmp{display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.toast{font-size:14px;color:var(--good);font-weight:700}
@media (max-width:480px){ h1{font-size:25px} .qtext{font-size:19px} .card{padding:16px} .matchrow{grid-template-columns:1fr} .tf{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ .prog>i{transition:none} }
</style>
<style>
/* ---- v3: learning profile ---- */
.conf{margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--soft)}
.conf p{margin:0 0 8px;font-weight:700}
.conf .cb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conf button{appearance:none;border:2px solid var(--line);background:#fff;color:var(--fg);font:700 15px var(--f-body);padding:8px 6px;border-radius:12px;cursor:pointer;min-height:48px}
.conf button span{display:block;font-size:22px;line-height:1.1}
.conf button.sel{border-color:var(--c);background:var(--c-soft)}
.conf button:disabled{cursor:default}
.fmt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fmt button{appearance:none;border:2px solid var(--c);background:#fff;color:var(--fg);font:700 16px var(--f-body);padding:14px 10px;border-radius:16px;cursor:pointer;text-align:center;min-height:110px}
.fmt button span{display:block;font-size:34px;margin-bottom:4px}
.fmt button:hover{background:var(--c-soft)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{appearance:none;border:2px solid var(--c);background:#fff;color:var(--fg);font:700 14px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--c);color:#fff}
.theory p{margin:6px 0}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box4{border-radius:14px;padding:10px 12px;border:2px solid var(--line);background:#fff;min-width:0}
.box4 .n{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.box4 .t{font-weight:700}
.box4 .d{font-size:13px;color:var(--muted)}
.box4.g{border-color:var(--good)} .box4.y{border-color:var(--mid)} .box4.r{border-color:var(--bad)} .box4.e{border-color:#8a99a6}
.box4 ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.recs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.recs li{background:var(--soft);border-radius:12px;padding:10px 12px;border-left:5px solid #2d7ff9}
.recs li b{display:block}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:15px}
.kv span:nth-child(2n){font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.note2{font-size:13px;color:var(--muted)}
.pcard h3{margin-top:4px}
@media (max-width:480px){ .fmt{grid-template-columns:1fr} .fmt button{min-height:auto;display:flex;align-items:center;gap:12px;text-align:left} .fmt button span{margin:0;font-size:28px} .grid4{grid-template-columns:1fr} }
.mode2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode2 button{appearance:none;border:3px solid var(--line);background:#fff;color:var(--fg);font:700 17px var(--f-body);padding:14px;border-radius:16px;cursor:pointer;text-align:left}
.mode2 button span{display:block;font-size:30px}
.mode2 button small{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:4px}
.mode2 button.sel{border-color:#ff6b4a;background:#ffe7e0}
.agrid{display:grid;gap:3px;margin:10px auto 14px;width:100%}
.agrid i{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:2px solid #1d2b36;border-radius:5px;font:700 16px var(--f-display);font-style:normal;background:#fff;min-width:0}
.agrid i.k{background:var(--c-soft);border-color:var(--c)}
.agrid i.e{border:0;background:none}
.agrid b{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.acrow{display:grid;gap:4px;padding:8px 0;border-bottom:1px dashed var(--line)}
.acrow input.ok{border-color:var(--good);background:var(--good-soft)} .acrow input.no{border-color:var(--bad);background:var(--bad-soft)}
textarea.def{width:100%;min-height:110px;font:600 18px var(--f-body);padding:10px 12px;border:2px solid var(--line);border-radius:12px;color:var(--fg)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.keys span{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px}
.keys .y{background:var(--good-soft);color:var(--good)} .keys .n{background:var(--bad-soft);color:var(--bad)}
.cz{font-size:19px;line-height:2.3}
.cz select{min-height:40px;font-size:16px;padding:4px 8px;margin:2px;max-width:100%}
.cz select.ok{border-color:var(--good);background:var(--good-soft)} .cz select.no{border-color:var(--bad);background:var(--bad-soft)}
table.mini{border-collapse:collapse;font-size:15px}
table.mini td,table.mini th{border:1px solid var(--line);padding:5px 12px;text-align:left}
table.mini th{background:var(--soft)}
@media (max-width:480px){ .mode2{grid-template-columns:1fr} .agrid i{font-size:13px} }
.paper{background:#fff;color:#111;padding:18px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.phead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:6px}
.psec{margin:16px 0 6px;padding:4px 10px;border:2px solid #111;border-radius:6px;font-size:15px}
.pq{margin:8px 0 12px;break-inside:avoid}
.pq .fig{transform:scale(.85);transform-origin:left top;margin-bottom:-20px}
.tfq{display:flex;justify-content:space-between;gap:12px}.tfq .sl{white-space:nowrap;font-weight:700}
.popts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:2px 14px;margin-top:4px}
.pl{display:inline-block;border-bottom:1.3px solid #111;height:1em;vertical-align:baseline}
.plines i{display:block;border-bottom:1.2px solid #999;height:26px}
.pbank{border:1.5px dashed #555;border-radius:6px;padding:4px 8px;margin:4px 0;text-align:center}
.pclues{margin:4px 0;padding-left:20px;font-size:14px}
.paper .agrid{margin:6px 0;max-width:420px}.paper .agrid i{border-width:1.5px;background:#fff}.paper .agrid i.k{background:#ddd;border-width:2.5px;border-color:#111}
.pans{break-before:page;margin-top:24px;font-size:13px}.pans li{margin:2px 0}
@media print{ body{background:#fff!important} .top,#parent,.noprint{display:none!important} .wrap{max-width:none;padding:0} .paper{border:0;padding:0} @page{margin:14mm} }
.hist2 .hrow{display:grid;grid-template-columns:auto minmax(0,1fr) 3.2em;gap:10px;align-items:center;padding:5px 6px;border-radius:10px}
.hist2 .hrow.now{background:#fff6d6}
.hist2 .hd{font-size:13px;color:var(--muted);white-space:nowrap}
.hist2 .htr{height:14px;border-radius:999px;background:var(--soft);overflow:hidden}.hist2 .htr i{display:block;height:100%;border-radius:999px}
.hist2 .hp{text-align:right;font-variant-numeric:tabular-nums}
.hbig{font-size:18px;margin:0}
</style>

<div class="wrap">
  <div class="top"><span class="brand">Φυσικά Ε΄ · Υλικά σώματα</span><span class="save" id="savestate"></span></div>
  <div id="view"></div>
  <div id="parent" style="margin-top:16px"></div>
</div>

<script>
(function(){
/* ======================= ΕΝΟΤΗΤΕΣ, ΤΡΟΠΟΙ, ΜΟΡΦΕΣ ======================= */
const CONCEPTS = {
  domi:       {name:'Μόρια και άτομα',        col:'#7a5cff', soft:'#ece7ff'},
  enoseis:    {name:'Στοιχεία και ενώσεις',   col:'#0f9d8f', soft:'#dcf5f1'},
  katastaseis:{name:'Στερεά, υγρά, αέρια',    col:'#2d7ff9', soft:'#e2edff'},
  ogkos:      {name:'Όγκος',                  col:'#e8590c', soft:'#ffeadb'},
  maza:       {name:'Μάζα',                   col:'#d6336c', soft:'#fde4ec'},
  pyknotita:  {name:'Πυκνότητα',              col:'#2b9348', soft:'#e1f5e6'},
  monades:    {name:'Μονάδες και μετατροπές', col:'#b26b00', soft:'#fff0d6'}
};
/* how the question asks her to think */
const MODES = {
  vivlio:{name:'Θυμάμαι το βιβλίο',     icon:'📖', desc:'ορισμοί, λέξεις, γεγονότα'},
  eikona:{name:'Διαβάζω εικόνες',       icon:'🖼️', desc:'σχήματα, σωλήνας, ζυγός, μόρια'},
  praxi: {name:'Αριθμοί και πράξεις',   icon:'🔢', desc:'αφαιρέσεις, αθροίσματα, μετατροπές'},
  skepsi:{name:'Σκέψη και παραδείγματα',icon:'💭', desc:'εφαρμογή στη ζωή, «γιατί»'}
};
/* how she has to answer */
const TYPES = {
  anag:{name:'Διαλέγει από επιλογές', types:['mcq','tf','cloze']},
  anak:{name:'Γράφει μόνη της τη λέξη', types:['fill','acro']},
  orism:{name:'Γράφει ορισμό με δικά της λόγια', types:['def']},
  synd:{name:'Συνδέει / βάζει σε σειρά', types:['match','order']},
  arith:{name:'Γράφει αριθμό', types:['num']}
};
/* explanation formats offered in reinforcement */
const FORMATS = {
  eikona:{name:'Με εικόνα', icon:'🖼️'},
  zoi:   {name:'Με παράδειγμα από τη ζωή', icon:'🍎'},
  vivlio:{name:'Όπως το λέει το βιβλίο', icon:'📖'}
};
const CONF = [{v:0,icon:'🤔',name:'Μαντεύω'},{v:1,icon:'🙂',name:'Νομίζω'},{v:2,icon:'😎',name:'Σίγουρη'}];

/* ======================= ΣΧΗΜΑΤΑ (SVG) ======================= */
const F='font-family="Commissioner,sans-serif"';
function cyl(level, stone, cap){
  const H=180, top=12, y=v=>top+H-(v/100)*H;
  let ticks=''; for(let v=10;v<=100;v+=10){ const yy=y(v); ticks+=`<line x1="66" y1="${yy}" x2="${v%20?72:78}" y2="${yy}" stroke="#1d2b36" stroke-width="1.5"/>`+(v%20?'':`<text x="82" y="${yy+4}" font-size="11" ${F} fill="#1d2b36">${v}</text>`); }
  return `<svg width="120" height="230" viewBox="0 0 120 230" role="img" aria-label="${cap}">
    <rect x="22" y="${y(level)}" width="44" height="${top+H-y(level)}" fill="#8fd0f5"/>
    <line x1="22" y1="${y(level)}" x2="66" y2="${y(level)}" stroke="#1767a8" stroke-width="2.5"/>
    ${stone?`<ellipse cx="44" cy="${top+H-12}" rx="15" ry="10" fill="#7d8790" stroke="#1d2b36" stroke-width="1.5"/>`:''}
    <path d="M22 ${top} V${top+H} H66 V${top}" fill="none" stroke="#1d2b36" stroke-width="2.5"/>${ticks}
    <text x="44" y="${top+H+30}" text-anchor="middle" font-size="13" font-weight="700" ${F} fill="#1d2b36">${cap}</text></svg>`;
}
function cylPair(a,b){ return `<div class="fig">${cyl(a,false,'Α. πριν')}${cyl(b,true,'Β. με την πέτρα')}</div><p class="hintline" style="text-align:center">Οι αριθμοί είναι ml. Κάθε γραμμή = 10 ml, μισή γραμμή = 5 ml.</p>`; }
function balance(obj, weights){
  let x=176, ws='';
  weights.forEach(w=>{ const r=Math.round(9+Math.cbrt(w)*2.2); ws+=`<rect x="${x}" y="${78-r*1.4}" width="${r*1.4}" height="${r*1.4}" rx="3" fill="#f2c14e" stroke="#1d2b36"/><text x="${x+r*.7}" y="${78-r*.7+4}" text-anchor="middle" font-size="11" font-weight="700" ${F} fill="#1d2b36">${w}</text>`; x+=r*1.4+6; });
  return `<div class="fig"><svg width="320" height="170" viewBox="0 0 320 170" role="img" aria-label="Ζυγός σε ισορροπία">
    <polygon points="160,40 146,150 174,150" fill="#c9d6de" stroke="#1d2b36"/><rect x="110" y="150" width="100" height="10" rx="3" fill="#8aa1ad"/>
    <line x1="40" y1="40" x2="280" y2="40" stroke="#1d2b36" stroke-width="5" stroke-linecap="round"/><circle cx="160" cy="40" r="5" fill="#1d2b36"/>

  vivlio:()=>`<p>Η <b>μάζα</b> ενός σώματος εκφράζει το ποσό της ύλης από το οποίο αυτό αποτελείται. Μονάδα είναι το χιλιόγραμμο ή κιλό (kg). 1 kg = 1000 g, 1 t = 1000 kg.</p><p>Τη μάζα τη μετράμε με τον <b>ζυγό σύγκρισης</b>, συγκρίνοντάς τη με σώματα γνωστής μάζας, τα <b>σταθμά</b>.</p><p>Η μάζα είναι χαρακτηριστική ιδιότητα του σώματος και δεν αλλάζει όπου κι αν βρίσκεται.</p>`
 },
 pyknotita:{
  eikona:()=>densitySvg(false)+`<p>Δύο κύβοι με <b>ίδιο όγκο</b>. Στον χρυσό η ύλη είναι πολύ «στριμωγμένη» (πολλές τελείες), στον φελλό «αραιή». Ο χρυσός έχει <b>μεγαλύτερη πυκνότητα</b>, άρα και περισσότερη μάζα.</p>`,
  zoi:()=>`<p>🪣 Δύο ίδιοι κουβάδες: ο ένας με <b>άμμο</b>, ο άλλος με <b>ποπ κορν</b>. Ίδιος όγκος, αλλά ο κουβάς με την άμμο έχει πολύ περισσότερη μάζα. Η άμμος έχει μεγαλύτερη <b>πυκνότητα</b>.</p><p>🛗 Ένα ασανσέρ γεμάτο κόσμο στριμωγμένο είναι «πυκνό». Το ίδιο ασανσέρ με 2 ανθρώπους είναι «αραιό».</p><p>☁️ 1 kg βαμβάκι και 1 kg σίδερο έχουν <b>ίδια μάζα</b>! Απλώς το βαμβάκι θέλει μια τεράστια σακούλα, ενώ το σίδερο χωράει στη χούφτα σου.</p>`,
  vivlio:()=>`<p>Η <b>πυκνότητα</b> είναι μια χαρακτηριστική ιδιότητα των σωμάτων και εκφράζει την ποσότητα της μάζας στη μονάδα του όγκου. Μονάδες: g/cm³ ή kg/m³.</p><p>Για να συγκρίνουμε υλικά, παίρνουμε ίσους όγκους: 1 cm³ σιδήρου έχει μάζα 7,8 g, ενώ 1 cm³ χαρτιού 1 g.</p><p>Πυκνότητες (g/cm³): χρυσός 19,3 · σίδηρος 7,8 · νερό 1 · πάγος 0,92 · φελλός 0,24.</p>`
 },
 monades:{
  eikona:()=>ladderSvg()+`<p>Από τη <b>μεγάλη</b> μονάδα στη <b>μικρή</b> (πράσινο βέλος): <b>× 1000</b>. Από τη μικρή στη μεγάλη (κόκκινο βέλος): <b>÷ 1000</b>. Και κάτι ακόμα: <b>1 ml = 1 cm³</b>.</p>`,
  zoi:()=>`<p>🧴 Ένα μεγάλο μπουκάλι νερό γράφει <b>1,5 l</b>, δηλαδή 1500 ml. Ένα κουτάκι αναψυκτικό γράφει <b>330 ml</b>.</p><p>🍬 Ένα πακέτο ζάχαρη είναι <b>1 kg</b> = 1000 g. Μια σοκολάτα 100 g είναι το ένα δέκατο του κιλού.</p><p>🚗 Ένα αυτοκίνητο έχει περίπου <b>1 t</b> (τόνο) = 1000 kg.</p><p>👉 Κάθε φορά που πας στη μικρότερη μονάδα, ο αριθμός μεγαλώνει (× 1000).</p>`,
  vivlio:()=>`<p><b>Όγκος</b>: κυβικό μέτρο (m³), λίτρο (l), κυβικό εκατοστό (cm³ ή ml). 1 l = 1000 cm³.</p><p><b>Μάζα</b>: χιλιόγραμμο (kg), γραμμάριο (g), τόνος (t). 1 kg = 1000 g, 1 t = 1000 kg.</p><p><b>Πυκνότητα</b>: g/cm³ ή kg/m³.</p>`
 }
};

function balance2(L, R, tilt, cap){
  // tilt: 0 ισορροπεί, -1 γέρνει αριστερά, 1 γέρνει δεξιά
  const dy = tilt*22, ly=40-(-dy), ry=40-dy;
  const yl = 40+(tilt===-1?22:tilt===1?-22:0), yr = 40+(tilt===1?22:tilt===-1?-22:0);
  return `<div class="fig"><svg width="320" height="180" viewBox="0 0 320 180" role="img" aria-label="${cap||'ζυγός'}">
    <polygon points="160,40 146,160 174,160" fill="#c9d6de" stroke="#1d2b36"/><rect x="110" y="160" width="100" height="10" rx="3" fill="#8aa1ad"/>
    <line x1="40" y1="${yl}" x2="280" y2="${yr}" stroke="#1d2b36" stroke-width="5" stroke-linecap="round"/><circle cx="160" cy="40" r="5" fill="#1d2b36"/>
    <line x1="40" y1="${yl}" x2="40" y2="${yl+40}" stroke="#1d2b36"/><line x1="280" y1="${yr}" x2="280" y2="${yr+40}" stroke="#1d2b36"/>
    <path d="M0 ${yl+40} Q40 ${yl+62} 80 ${yl+40} Z" fill="#dfe8ee" stroke="#1d2b36"/><path d="M240 ${yr+40} Q280 ${yr+62} 320 ${yr+40} Z" fill="#dfe8ee" stroke="#1d2b36"/>
    <rect x="12" y="${yl+12}" width="56" height="28" rx="5" fill="#b8c2ff" stroke="#1d2b36"/><text x="40" y="${yl+31}" text-anchor="middle" font-size="12" font-weight="700" ${F} fill="#1d2b36">${L}</text>
    <rect x="252" y="${yr+12}" width="56" height="28" rx="5" fill="#ffd0a8" stroke="#1d2b36"/><text x="280" y="${yr+31}" text-anchor="middle" font-size="12" font-weight="700" ${F} fill="#1d2b36">${R}</text>
    ${tilt===0?`<text x="160" y="22" text-anchor="middle" font-size="12" font-weight="700" ${F} fill="#1f9e5a">ισορροπεί</text>`:''}</svg></div>`;
}
function cylBig(level, stone, cap){
  const H=180, top=12, max=300, y=v=>top+H-(v/max)*H;
  let ticks=''; for(let v=25;v<=max;v+=25){ const yy=y(v); const lab=v%50===0; ticks+=`<line x1="66" y1="${yy}" x2="${lab?78:72}" y2="${yy}" stroke="#1d2b36" stroke-width="1.5"/>`+(lab?`<text x="82" y="${yy+4}" font-size="11" ${F} fill="#1d2b36">${v}</text>`:''); }
  return `<svg width="120" height="230" viewBox="0 0 120 230" role="img" aria-label="${cap}">
    <rect x="22" y="${y(level)}" width="44" height="${top+H-y(level)}" fill="#8fd0f5"/>
    <line x1="22" y1="${y(level)}" x2="66" y2="${y(level)}" stroke="#1767a8" stroke-width="2.5"/>
    ${stone?`<ellipse cx="44" cy="${top+H-12}" rx="15" ry="10" fill="#7d8790" stroke="#1d2b36" stroke-width="1.5"/>`:''}
    <path d="M22 ${top} V${top+H} H66 V${top}" fill="none" stroke="#1d2b36" stroke-width="2.5"/>${ticks}
    <text x="44" y="${top+H+30}" text-anchor="middle" font-size="13" font-weight="700" ${F} fill="#1d2b36">${cap}</text></svg>`;
}
function tbl(rows, h){ return `<div class="fig"><table class="mini">${h?`<tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>`:''}${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`; }

/* ======================= ΠΑΡΑΛΛΑΓΕΣ =======================
   Κάθε φορά που ξεκινάει κουίζ ή πρόβα, κάθε ερώτηση παίρνει έναν τυχαίο «σπόρο».
   Από αυτόν διαλέγεται παραλλαγή (VARS), φτιάχνονται νέοι αριθμοί (GENS) και ανακατεύονται οι επιλογές. */
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
const pick=(R,a)=>a[Math.floor(R()*a.length)];
const rshuf=(R,a)=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const DENS=[['χρυσός',19.3],['υδράργυρος',13.6],['μόλυβδος',11.3],['χαλκός',8.9],['σίδηρος',7.8],['αλουμίνιο',2.7],['νερό',1],['πάγος',0.92],['οινόπνευμα',0.8],['φελλός',0.24]];
const SOLIDS=[['χρυσό',19.3],['μόλυβδο',11.3],['χαλκό',8.9],['σίδηρο',7.8],['αλουμίνιο',2.7],['φελλό',0.24]];
function convGen(kind){ return R=>{
  const pairs = kind==='v' ? [['l','ml'],['m³','l']] : [['kg','g'],['t','kg']];
  const [big,small]=pick(R,pairs); const up=R()<0.6; const n=pick(R,[2,3,4,5,6,1.5,2.5]);
  if(up) return {q:`${fmtNum(n)} ${big} = ? ${small}`,a:n*1000,unit:small,mis:{[n*100]:`Κάνει λάθος στις μετατροπές: 1 ${big} = 1000 ${small} (όχι 100).`,[n*10]:`Κάνει λάθος στις μετατροπές: 1 ${big} = 1000 ${small}.`,[n]:'Δεν άλλαξε τον αριθμό στη μετατροπή.'},misDefault:'Κάνει λάθος στις μετατροπές μονάδων.',ex:`1 ${big} = 1000 ${small}, άρα ${fmtNum(n)} ${big} = ${fmtNum(n)} × 1000 = ${n*1000} ${small}.`};
  return {q:`${n*1000} ${small} = ? ${big}`,a:n,unit:big,mis:{[n*1000]:'Δεν άλλαξε τον αριθμό στη μετατροπή.',[n*10]:`Κάνει λάθος στις μετατροπές: ÷ 1000 (όχι ÷ 100).`,[n*1000000]:'Πολλαπλασιάζει αντί να διαιρεί (από μικρή σε μεγάλη μονάδα: ÷ 1000).'},misDefault:'Κάνει λάθος στις μετατροπές μονάδων.',ex:`Από μικρή σε μεγάλη μονάδα: ÷ 1000. ${n*1000} ÷ 1000 = ${fmtNum(n)} ${big}.`};
}; }
function cylGen(R){ const s=pick(R,[20,30,40,50]); const d=pick(R,[15,20,25,30,35].filter(x=>s+x<=95)); const e=s+d;
  return {fig:()=>cylPair(s,e),a:d,mis:{[e]:'Γράφει την τελική ένδειξη αντί για τη διαφορά (τελική − αρχική).',[s]:'Γράφει την αρχική ένδειξη αντί για τη διαφορά.',[s+e]:'Προσθέτει τις ενδείξεις αντί να τις αφαιρεί.',[d-5]:'Διαβάζει λάθος τις γραμμές του σωλήνα.',[d+5]:'Διαβάζει λάθος τις γραμμές του σωλήνα.'},ex:`${e} − ${s} = ${d} cm³ (1 ml = 1 cm³).`}; }
function balGen(R){ const obj=pick(R,['αχλάδι','μήλο','πορτοκάλι','ντομάτα','λεμόνι']); let ws=rshuf(R,[200,100,50,20,10,5]).slice(0,pick(R,[3,4])).sort((a,b)=>b-a); const sum=ws.reduce((a,b)=>a+b,0);
  return {q:`Ο ζυγός ισορροπεί. Πόση είναι η μάζα του φρούτου (${obj});`,fig:()=>balance(obj,ws),a:sum,mis:{[ws[0]]:'Κοιτάζει μόνο ένα σταθμό αντί για το άθροισμα όλων.',[ws.length]:'Μετράει πόσα σταθμά υπάρχουν αντί να προσθέσει τις μάζες τους.'},ex:`${ws.join(' + ')} = ${sum} g.`}; }

function acroGen(R, hiddens, bank, info){
  for(let tries=0;tries<40;tries++){
    const H=pick(R,hiddens); const used=new Set(); const rows=[]; let ok=true;
    for(const ch of H){
      const cands=rshuf(R,bank.filter(([w])=>!used.has(w) && w.slice(0,3)!==H.slice(0,3) && w.includes(ch) && w.length<=11));
      if(!cands.length){ ok=false; break; }
      const [w,clue]=cands[0]; used.add(w); const idx=[...w].map((c,i)=>c===ch?i:-1).filter(i=>i>=0); rows.push({clue,w,p:pick(R,idx)});
    }
    if(!ok) continue;
    const g=Math.max(...rows.map(r=>r.p))+Math.max(...rows.map(r=>r.w.length-r.p)); if(g>13) continue;
    return {hidden:H,rows,q:`Λύσε την ακροστιχίδα. Στη χρωματιστή στήλη θα βρεις μια κρυμμένη λέξη (${H.length} γράμματα)!`,ex:`Κρυμμένη λέξη: ${H}. ${info[H]||''}`};
  }
  return {};
}

function materialize(base, seed){
  const R=rng(seed); const q=Object.assign({}, base);
  const vs=VARS[base.id]; if(vs) Object.assign(q, vs[Math.floor(R()*vs.length)]);
  const g=GENS[base.id]; if(g) Object.assign(q, g(R));
  if(q.t==='mcq' && !q.opts.every(o=>o.length<=6)){
    const idx=rshuf(R, q.opts.map((_,i)=>i));
    const mis={}; if(q.mis) idx.forEach((old,nw)=>{ if(q.mis[old]!=null) mis[nw]=q.mis[old]; });
    q.opts=idx.map(i=>q.opts[i]); q.a=idx.indexOf(q.a); q.mis=mis;
  }
  return q;
}

function grade(q, resp){
  if(q.t==='mcq'){ const ok=resp===q.a; return {score:ok?1:0, mis: ok?null:((q.mis&&q.mis[resp])||null), given:q.opts[resp], right:q.opts[q.a]}; }
  if(q.t==='tf'){ const ok=resp===q.a; return {score:ok?1:0, mis: ok?null:(q.mis||null), given:resp?'Σωστό':'Λάθος', right:q.a?'Σωστό':'Λάθος'}; }
  if(q.t==='fill'){ const n=norm(resp); const ok=q.a.some(x=>norm(x)===n); let mis=null; if(!ok && q.mis){ for(const k in q.mis){ if(norm(k)===n){ mis=q.mis[k]; break; } } } return {score:ok?1:0, mis, given:resp||'(κενό)', right:q.show}; }
  if(q.t==='num'){ const v=toNum(resp); const ok=Math.abs(v-q.a)<1e-9; let mis=null; if(!ok){ mis=(q.mis&&q.mis[v])||q.misDefault||null; } return {score:ok?1:0, mis, given:(isNaN(v)?String(resp||'(κενό)'):fmtNum(v))+' '+q.unit, right:fmtNum(q.a)+' '+q.unit}; }
  if(q.t==='match'){ let c=0; q.items.forEach((it,i)=>{ if(resp[i]===it[1]) c++; }); const sc=c/q.items.length; return {score:sc, mis: sc<1?(q.mis||null):null, given:q.items.map((it,i)=>it[0]+' → '+(resp[i]||'—')).join(' · '), right:q.items.map(it=>it[0]+' → '+it[1]).join(' · ')}; }
  if(q.t==='acro'){ const ok=q.rows.map((r,i)=>norm(resp[i]).replace(/\s/g,'')===norm(r.w)); const c=ok.filter(Boolean).length; const sc=c/q.rows.length; const miss=q.rows.filter((r,i)=>!ok[i]).map(r=>r.w); return {score:sc, n:c, of:q.rows.length, okRows:ok, mis: sc<1?(q.mis||null):null, given:q.rows.map((r,i)=>(resp[i]||'—').toUpperCase()).join(', '), right:q.rows.map(r=>r.w).join(', ')+' → '+q.hidden}; }
  if(q.t==='def'){ const n=' '+norm(resp)+' '; const hit=q.keys.map(g=>g.k.some(k=>n.includes(norm(k)))); const c=hit.filter(Boolean).length; const sc=c/q.keys.length; return {score:sc, n:c, of:q.keys.length, hit, mis: sc<1?(q.mis||null):null, given:resp||'(κενό)', right:q.model}; }
  if(q.t==='cloze'){ const used={}; const ok=q.blanks.map((b,i)=>{ const r=resp[i]; if(!r || !b.a.includes(r)) return false; if(b.g){ used[b.g]=used[b.g]||[]; if(used[b.g].includes(r)) return false; used[b.g].push(r); } return true; }); const c=ok.filter(Boolean).length; const sc=c/q.blanks.length; return {score:sc, n:c, of:q.blanks.length, okB:ok, mis: sc<1?(q.mis||null):null, given:q.blanks.map((b,i)=>resp[i]||'—').join(' · '), right:clozeRight(q)}; }
  if(q.t==='order'){ let c=0; q.items.forEach((it,i)=>{ if(resp[i]===it) c++; }); const sc=c/q.items.length; return {score:sc, mis: sc<1?(q.mis||null):null, given:resp.join(' → '), right:q.items.join(' → ')}; }
}

function clozeRight(q){ const seen={}; return q.blanks.map(b=>{ if(!b.g) return b.a[0]; seen[b.g]=(seen[b.g]||0); return b.a[seen[b.g]++]; }).join(' · '); }
function acroGeom(q){ const L=Math.max(...q.rows.map(r=>r.p)); const R=Math.max(...q.rows.map(r=>r.w.length-r.p)); return {L,R,N:L+R}; }
function acroGrid(q, words){ const g=acroGeom(q); let h=''; q.rows.forEach((r,i)=>{ h+=`<b>${i+1}</b>`; const off=g.L-r.p; const w=(words&&words[i])||''; for(let x=0;x<g.N;x++){ const j=x-off; if(j<0||j>=r.w.length){ h+='<i class="e"></i>'; continue; } const ch=w[j]||''; h+=`<i class="${j===r.p?'k':''}">${esc(ch)}</i>`; } }); return `<div class="agrid" style="grid-template-columns:18px repeat(${g.N},minmax(0,1fr));max-width:${18+g.N*34}px">${h}</div>`; }

function historyCard(mode, compare){
  const all=histLoad().filter(e=>e.mode===mode); if(!all.length) return '';
  const name = mode==='prova'?'στην πρόβα διαγωνίσματος':'στο κουίζ';
  const best=Math.max(...all.map(e=>e.pct));
  let top='';
  if(compare && all.length>=2){ const now=all[all.length-1], prev=all[all.length-2]; const d=now.pct-prev.pct;
    top = d>0 ? `<p class="hbig">🚀 Ανέβηκες <b>${d}%</b> από την προηγούμενη φορά (${prev.pct}% → ${now.pct}%)!</p>`
        : d===0 ? `<p class="hbig">💪 Ίδιο σκορ με την προηγούμενη φορά (${now.pct}%). Συνέχισε!</p>`
        : `<p class="hbig">🌱 Την προηγούμενη φορά είχες ${prev.pct}%, τώρα ${now.pct}%. Οι ερωτήσεις αλλάζουν κάθε φορά, οπότε είναι φυσικό. Ξαναδοκίμασε!</p>`;
    if(now.pct===best && all.length>=2 && d>0) top+=`<p class="hbig">⭐ Νέο ρεκόρ!</p>`; }
  else if(!compare) top=`<p>Μέχρι τώρα: <b>${all.length}</b> ${all.length===1?'προσπάθεια':'προσπάθειες'} ${name} · καλύτερο σκορ <b>${best}%</b></p>`;
  const rows=all.slice(-8).map((e,i,arr)=>{ const d=new Date(e.ts); const last=compare&&i===arr.length-1;
    return `<div class="hrow${last?' now':''}"><span class="hd">${d.toLocaleDateString('el-GR',{day:'numeric',month:'short'})} ${d.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})}${last?' · τώρα':''}</span><div class="htr"><i style="width:${Math.max(3,e.pct)}%;background:${e.pct>=80?'#1f9e5a':e.pct>=50?'#f0a020':'#e5484d'}"></i></div><b class="hp">${e.pct}%</b></div>`; }).join('');
  return `<div class="card stack hist2"><h2>📈 Οι προσπάθειές σου ${name}</h2>${top}<div>${rows}</div>${all.length>8?`<p class="hintline">Φαίνονται οι τελευταίες 8 από ${all.length}.</p>`:''}</div>`;
}

function analyse(list, answers){
  const per={}; Object.keys(CONCEPTS).forEach(k=>per[k]={got:0,total:0});
  const mis={}; const wrong=[];
  list.forEach(id=>{ const q=byId(id), a=answers[id]; if(!a) return; per[q.c].total++; per[q.c].got+=a.score;
    if(a.score<1){ wrong.push({id, c:q.c, q:q.q, given:a.given, right:a.right, conf:a.conf}); if(a.mis){ (mis[a.mis]=mis[a.mis]||{text:a.mis,c:q.c,n:0,ex:q.ex,sure:false}).n++; if(a.conf===2) mis[a.mis].sure=true; } } });
  let got=0,total=0; Object.values(per).forEach(p=>{ got+=p.got; total+=p.total; });
  return {per, got, total, pct: total? Math.round(got/total*100):0, mis:Object.values(mis), wrong};
}
function profile(list, answers){
  const modes={}; Object.keys(MODES).forEach(k=>modes[k]={got:0,total:0});
  const types={}; Object.keys(TYPES).forEach(k=>types[k]={got:0,total:0});
  const box={know:[],fragile:[],belief:[],gap:[]};
  const conf={0:{n:0,ok:0},1:{n:0,ok:0},2:{n:0,ok:0}};
  const times=[]; const rushed=[];
  list.forEach(id=>{ const q=byId(id), a=answers[id]; if(!a) return;
    q.m.forEach(m=>{ modes[m].total++; modes[m].got+=a.score; });
    const tg=typeGroup(q.t); types[tg].total++; types[tg].got+=a.score;
    const ok=a.score===1; const sure=a.conf===2;
    const item={id, c:q.c, q:q.q};
    if(ok&&sure) box.know.push(item); else if(ok) box.fragile.push(item); else if(sure) box.belief.push(item); else box.gap.push(item);
    if(a.conf!=null){ conf[a.conf].n++; if(ok) conf[a.conf].ok++; }
    times.push(a.ms/1000);
    if(!ok && a.fast) rushed.push(item);
  });
  times.sort((x,y)=>x-y);
  const median = times.length? times[Math.floor(times.length/2)] : 0;
  const mp={}; Object.keys(modes).forEach(k=>mp[k]=pct(modes[k].got,modes[k].total));
  const tp={}; Object.keys(types).forEach(k=>tp[k]=pct(types[k].got,types[k].total));
  return {modes, types, mp, tp, box, conf, median:Math.round(median), rushed};
}

  return fs;
}

        skepsi:'Θυμάται τη θεωρία αλλά δυσκολεύεται να την εφαρμόσει. Μετά από κάθε ορισμό ρωτήστε «πού το βλέπουμε στο σπίτι;» και «γιατί;».'};
      R.push({t:`Τα πάει καλύτερα στο «${MODES[best].name}» (${mp[best]}%)`, d:adv[best]});
      R.push({t:`Θέλει δουλειά στο «${MODES[worst].name}» (${mp[worst]}%)`, d:fix[worst]});
    } else {
      R.push({t:'Δεν φαίνεται μεγάλη διαφορά ανάμεσα στους τρόπους σκέψης', d:'Τα πάει περίπου το ίδιο με εικόνες, ορισμούς, πράξεις και παραδείγματα. Συνεχίστε με μείξη τρόπων.'});
    }
  }
  const tp=P.tp;
  if(tp.anag!==null && tp.anak!==null && tp.anag - tp.anak >= 20) R.push({t:'Αναγνωρίζει τη σωστή απάντηση, αλλά δυσκολεύεται να τη θυμηθεί μόνη της', d:`Διαλέγοντας από επιλογές: ${tp.anag}% · γράφοντας μόνη της: ${tp.anak}%. Χρειάζεται εξάσκηση ανάκλησης: κενά, κάρτες, να εξηγεί φωναχτά χωρίς να κοιτάει.`});
  if(P.box.belief.length>=2) R.push({t:`${P.box.belief.length} λάθος πεποιθήσεις που πιστεύει σίγουρα`, d:'Αυτές δεν φεύγουν με απλή επανάληψη. Θέλουν συζήτηση και ένα μικρό πείραμα που δείχνει ότι δεν ισχύουν (π.χ. σύριγγα με νερό, 1 kg βαμβάκι και 1 kg σίδερο).'});
  if(P.box.fragile.length>=3) R.push({t:`${P.box.fragile.length} σωστές απαντήσεις χωρίς σιγουριά`, d:'Τα ξέρει «περίπου». Μια γρήγορη επανάληψη σε αυτά θα τα κάνει σταθερά.'});
  const c2=P.conf[2]; if(c2.n>=5 && c2.ok/c2.n<0.7) R.push({t:'Είναι συχνά σίγουρη ενώ κάνει λάθος', d:`Όταν λέει «σίγουρη», έχει δίκιο στο ${pct(c2.ok,c2.n)}%. Ζητήστε της να ελέγχει την απάντηση πριν προχωρήσει.`});
  const c0=P.conf[0]; if(c0.n>=4 && c0.ok/c0.n>=0.6) R.push({t:'Ξέρει περισσότερα από όσα πιστεύει', d:`Όταν λέει «μαντεύω», βρίσκει σωστά το ${pct(c0.ok,c0.n)}%. Χρειάζεται ενθάρρυνση να εμπιστεύεται τον εαυτό της.`});
  if(P.rushed.length>=3) R.push({t:`${P.rushed.length} βιαστικά λάθη`, d:'Απάντησε πιο γρήγορα απ\' όσο χρειάζεται για να διαβαστεί η ερώτηση. Να διαβάζει την ερώτηση δύο φορές και να υπογραμμίζει τη λέξη-κλειδί.'});
  if(survey && survey.pref){
    const map={eikona:'eikona',zoi:'skepsi',vivlio:'vivlio'};
    const m=map[survey.pref];
    if(m && mp[m]!==null){ const others=valid.filter(k=>k!==m).map(k=>mp[k]); const avg=others.length?others.reduce((a,b)=>a+b,0)/others.length:mp[m];
      if(mp[m] < avg-15) R.push({t:'Αυτό που λέει ότι τη βοηθάει δεν είναι αυτό που της βγαίνει καλύτερα', d:`Είπε ότι τη βοηθούν «${SURVEY[0].o.find(o=>o[0]===survey.pref)[1].slice(2).trim()}», αλλά εκεί πήγε ${mp[m]}%. Κρατήστε αυτό που της αρέσει για να ξεκινάτε, αλλά ελέγχετε με τον τρόπο που της βγαίνει.`});
    }
    if(survey.pref==='peirama') R.push({t:'Της αρέσουν τα πειράματα', d:'Κάντε στο σπίτι τα πειράματα του Τετραδίου (βύθιση με ποτήρι, ζυγός με κρεμάστρα, σύριγγα): δένουν τη θεωρία.'});
  }
  if(fs){ const used=Object.keys(fs).filter(k=>fs[k].total>0);
    if(used.length){ const b=used.reduce((a,c)=>(fs[a].got/fs[a].total)>=(fs[c].got/fs[c].total)?a:c);
      R.push({t:`Στην ενίσχυση πήγε καλύτερα μετά από εξήγηση «${FORMATS[b].name}»`, d:used.map(k=>`${FORMATS[k].icon} ${FORMATS[k].name}: ${pct(fs[k].got,fs[k].total)}% (${fs[k].chosen} φορές)`).join(' · ')+'. Με λίγες προσπάθειες είναι ένδειξη, όχι σίγουρο συμπέρασμα.'}); } }
  return R;
}

/* ======================= ΑΠΟΤΕΛΕΣΜΑΤΑ ======================= */
function level(p){ return p>=80?['Το ξέρει! ⭐','b-good']: p>=50?['Σχεδόν · θέλει λίγη επανάληψη','b-mid']:['Θέλει ενίσχυση','b-bad']; }
function sectionScores(list, answers){ const r={}; list.forEach(id=>{ const q=byId(id), a=answers[id]; if(!q.sec||!a) return; r[q.sec]=r[q.sec]||{got:0,total:0}; r[q.sec].total++; r[q.sec].got+=a.score; }); Object.values(r).forEach(v=>v.got=+v.got.toFixed(2)); return r; }
function finishQuiz(){
  S.phase='results'; persist(); S.secs = S.mode==='prova' ? sectionScores(S.list,S.answers) : null;
  S.result=analyse(S.list,S.answers); S.prof=profile(S.list,S.answers);
  histAdd();
  saveAttempt();
  renderResults();
}
function renderResults(){

  const bars=Object.keys(CONCEPTS).map(k=>{ const p=A.per[k], v=pct(p.got,p.total); if(v===null) return ''; const L=level(v); return `<div class="bar"><span class="name">${CONCEPTS[k].name}<span class="badge ${L[1]}">${L[0]}</span></span><span class="val">${fmtNum(+p.got.toFixed(1))} / ${p.total}</span><div class="track"><i style="width:${Math.max(4,v)}%;background:${CONCEPTS[k].col}"></i></div></div>`; }).join('');
  const misHtml = A.mis.length ? A.mis.map(m=>`<div class="m" style="border-left-color:${CONCEPTS[m.c].col}"><span class="pill" style="background:${CONCEPTS[m.c].soft};color:${CONCEPTS[m.c].col}">${CONCEPTS[m.c].name}</span><div style="margin-top:6px">🤔 ${esc(m.text)}</div><div style="margin-top:4px"><span class="yes">✅ Το σωστό:</span> ${esc(m.ex)}</div></div>`).join('') : '<p>Δεν βρέθηκε κανένα μπέρδεμα. Μπράβο!</p>';
  const wrongHtml = A.wrong.length ? A.wrong.map(w=>`<div class="r"><div>${esc(w.q.replace('___','…'))}</div><div>Έγραψες: <em>${esc(w.given)}</em> · Σωστό: <b>${esc(w.right)}</b></div></div>`).join('') : '<p>Καμία λάθος απάντηση!</p>';
  view.innerHTML = `<div class="stack">
    <div class="card"><div class="score"><div class="ring" style="--p:${A.pct}"><div>${A.pct}%<small>${fmtNum(+A.got.toFixed(1))} / ${A.total}</small></div></div>
      <div style="flex:1;min-width:200px"><h1>${S.name?esc(S.name)+', τ':'Τ'}ελείωσες!</h1><p>${msg}</p></div></div></div>

    <div class="card stack"><h2>Τι έχεις καταλάβει ανά ενότητα</h2><div class="bars">${bars}</div></div>

  $('#reinf').onclick=()=>startReinforce(weak.length?weak:Object.keys(CONCEPTS));
  $('#again').onclick=()=>{ S.phase='start'; renderStart(); window.scrollTo({top:0}); };
  bindProfileCard();
  window.scrollTo({top:0});
  renderParent();

function bindProfileCard(){ const b=$('#copy'); if(b) b.onclick=copyReport; }
function reportText(){
  const A=S.result, P=S.prof; const d=new Date(S.started||Date.now());
  const fs=formatStats(S.rLog); const R=recommendations(P,A,S.survey,S.rLog.length?fs:null);
  let t=`${S.mode==='prova'?'Πρόβα διαγωνίσματος':'Κουίζ'} «Υλικά σώματα» · ${S.name} · ${d.toLocaleDateString('el-GR')} ${d.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})}\nΣκορ: ${fmtNum(+A.got.toFixed(1))}/${A.total} (${A.pct}%)\n\nΑνά ενότητα:\n`;
  Object.keys(CONCEPTS).forEach(k=>{ const p=A.per[k], v=pct(p.got,p.total); if(v!==null) t+=`- ${CONCEPTS[k].name}: ${fmtNum(+p.got.toFixed(1))}/${p.total} (${v}%) · ${level(v)[0]}\n`; });
  if(S.secs) t+=`\nΑνά θέμα πρόβας:\n`+Object.keys(SECTIONS).filter(k=>S.secs[k]).map(k=>`- ${SECTIONS[k].name}: ${fmtNum(S.secs[k].got)}/${S.secs[k].total} (${pct(S.secs[k].got,S.secs[k].total)}%)`).join('\n')+'\n';
  t+=`\nΤρόποι σκέψης:\n`+Object.keys(MODES).map(k=>P.mp[k]===null?'':`- ${MODES[k].name}: ${P.mp[k]}%`).filter(Boolean).join('\n');
  t+=`\n\nΠώς απαντάει:\n`+Object.keys(TYPES).map(k=>P.tp[k]===null?'':`- ${TYPES[k].name}: ${P.tp[k]}%`).filter(Boolean).join('\n');
  t+=`\n\nΣιγουριά: το ξέρει ${P.box.know.length} · εύθραυστο ${P.box.fragile.length} · λάθος πεποίθηση ${P.box.belief.length} · κενό ${P.box.gap.length}`;
  t+=`\nΤυπικός χρόνος: ${P.median} δευτ. · βιαστικά λάθη: ${P.rushed.length}`;
  if(S.survey&&S.survey.pref) t+=`\nΗ ίδια: `+SURVEY.map(s=>`${s.q} ${(s.o.find(o=>o[0]===S.survey[s.k])||['',''])[1]}`).join(' | ');
  t+=`\n\nΤι την μπέρδεψε:\n`+(A.mis.length?A.mis.map(m=>`- [${CONCEPTS[m.c].name}]${m.sure?' (σίγουρη!)':''} ${m.text}`).join('\n'):'- τίποτα');
  t+=`\n\nΠροτάσεις:\n`+R.map(r=>`- ${r.t}: ${r.d}`).join('\n');
  t+=`\n\nΛάθος απαντήσεις:\n`+(A.wrong.length?A.wrong.map(w=>`- ${w.q.replace('___','…')} | έγραψε: ${w.given} | σωστό: ${w.right} | σιγουριά: ${CONF[w.conf]?CONF[w.conf].name:'—'}`).join('\n'):'- καμία');
  if(S.reinf) t+=`\n\nΕνίσχυση: ${S.reinf.got}/${S.reinf.total} (${S.reinf.pct}%) · εξηγήσεις: `+S.rLog.map(l=>`${CONCEPTS[l.c].name} → ${FORMATS[l.first].name}${l.viewed.length>1?' (+'+(l.viewed.length-1)+')':''}: ${l.got}/${l.total}`).join(' · ');
  return t;
}
function copyReport(){
  const t=reportText(); const ta=$('#reptxt'); ta.value=t;

function startReinforce(concepts){
  S.reinfConcepts=concepts; S.rList=[]; S.rAnswers={}; S.rIdx=0; S.rLog=[];
  Object.keys(CONCEPTS).forEach(c=>{ if(concepts.includes(c)) S.rList=S.rList.concat(shuffle(EXTRA.filter(q=>q.c===c)).slice(0,3).map(q=>q.id)); });
  seedList(S.rList);

}
function renderFormatPick(c){

    <div class="fmt">${Object.keys(FORMATS).map(k=>`<button data-f="${k}"><span>${FORMATS[k].icon}</span>${FORMATS[k].name}</button>`).join('')}</div></div>`;
  view.querySelectorAll('.fmt button').forEach(b=>b.onclick=()=>{ S.rLog.push({c, first:b.dataset.f, viewed:[b.dataset.f], got:0, total:0}); renderTheory(c,b.dataset.f); });
  window.scrollTo({top:0});
}
function renderTheory(c,f){
  const log=S.rLog[S.rLog.length-1]; if(!log.viewed.includes(f)) log.viewed.push(f);
  const n=S.rList.filter(id=>byId(id).c===c).length;
  view.innerHTML = `<div class="card stack">
    <div class="prog"><i style="width:${(S.rIdx/S.rList.length)*100}%"></i></div>
    <span class="tag" style="align-self:flex-start">Ενίσχυση · ${CONCEPTS[c].name}</span>
    <div class="theory"><h3>Θυμήσου 💡 ${FORMATS[f].icon} ${FORMATS[f].name}</h3>${TH[c][f]()}</div>
    <div><p class="hintline" style="margin-bottom:6px">Θέλεις να το δεις κι αλλιώς;</p><div class="tabs">${Object.keys(FORMATS).map(k=>`<button data-f="${k}" aria-pressed="${k===f}">${FORMATS[k].icon} ${FORMATS[k].name}</button>`).join('')}</div></div>
    <p>Όταν είσαι έτοιμη, θα απαντήσεις σε ${n} νέες ερωτήσεις.</p>
    <div class="row end"><button class="btn c" id="tgo">Το κατάλαβα, πάμε! →</button></div></div>`;
  view.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>renderTheory(c,b.dataset.f));
  $('#tgo').onclick=()=>renderQ(true);
}
function finishReinforce(){
  const A=analyse(S.rList,S.rAnswers);
  S.rLog.forEach(l=>{ const p=A.per[l.c]; l.got=+p.got.toFixed(2); l.total=p.total; });
  const before=S.result;
  S.reinf={got:+A.got.toFixed(1),total:A.total,pct:A.pct}; histReinf(A.pct);
  S.rProf=profile(S.rList,S.rAnswers);
  saveReinforce(A);
  const rows=S.reinfConcepts.map(k=>{ const b=pct(before.per[k].got,before.per[k].total), a=pct(A.per[k].got,A.per[k].total); if(a===null) return ''; const up=a>b; const lg=S.rLog.find(l=>l.c===k); return `<div class="bar"><span class="name">${CONCEPTS[k].name} <span class="note2">${lg?FORMATS[lg.first].icon:''}</span></span><span class="val cmp">πριν ${b}% → τώρα <b style="color:${a>=80?'#1f9e5a':(up?'#1f9e5a':'#d93a2b')}">${a}%</b> ${up?'⬆':''}</span><div class="track"><i style="width:${Math.max(4,a)}%;background:${CONCEPTS[k].col}"></i></div></div>`; }).join('');
  const still=S.reinfConcepts.filter(k=>{ const a=pct(A.per[k].got,A.per[k].total); return a!==null && a<80; });
  brandColor();
  view.innerHTML = `<div class="stack"><div class="card stack">
    <h1>${A.pct>=80?'Τα κατάφερες! 🌟':'Μπράβο για την προσπάθεια! 👏'}</h1>
    <p>Στην ενίσχυση απάντησες σωστά <b>${fmtNum(+A.got.toFixed(1))} από ${A.total}</b>.</p>
    <div class="bars">${rows}</div>
    ${still.length?`<p>Αυτά θέλουν ακόμα λίγη δουλειά: <b>${still.map(k=>CONCEPTS[k].name).join(', ')}</b>. Δοκίμασε πάλι, και διάλεξε άλλον τρόπο εξήγησης!</p>`:'<p>Όλες οι ενότητες της ενίσχυσης είναι τώρα σε πολύ καλό επίπεδο!</p>'}
    <div class="row">${still.length?'<button class="btn" id="again2">Ξανά ενίσχυση σε αυτά</button>':''}<button class="btn ghost" id="back">Πίσω στα αποτελέσματα</button><button class="btn ghost" id="restart">Νέο κουίζ</button></div>
  </div></div>`;
  if($('#again2')) $('#again2').onclick=()=>startReinforce(still);
  $('#back').onclick=()=>renderResults();
  $('#restart').onclick=()=>{ S.phase='start'; renderStart(); };
  window.scrollTo({top:0});
}


/* ======================= ΕΚΤΥΠΩΣΗ ======================= */
function renderPrint(){
  brandColor();
  const list = S.mode==='prova' ? provaList() : shuffleWithinBlocks();
  S.seeds={}; QC={}; seedList(list);
  const L=['α','β','γ','δ']; let n=0, body='', ans='', lastSec=null, lastC=null;
  const line=w=>`<span class="pl" style="min-width:${w||140}px"></span>`;
  list.forEach(id=>{ const q=byId(id); n++;
    const head = S.mode==='prova' ? (q.sec!==lastSec ? `<h3 class="psec">${SECTIONS[q.sec].name}</h3>`:'') : (q.c!==lastC ? `<h3 class="psec">${CONCEPTS[q.c].name}</h3>`:'');
    lastSec=q.sec; lastC=q.c;
    let b='', a='';
    const qt = esc(q.q).replace('___',line(120));
    if(q.t==='tf'){ b=`<div class="pq tfq"><span><b>${n}.</b> ${qt}</span><span class="sl">Σ &nbsp; Λ</span></div>`; a=q.a?'Σ':'Λ'; }
    else if(q.t==='mcq'){ b=`<div class="pq"><b>${n}.</b> ${qt}${q.fig?q.fig():''}<div class="popts">${q.opts.map((o,i)=>`<span>${L[i]}) ${esc(o)}</span>`).join('')}</div></div>`; a=`${L[q.a]}) ${q.opts[q.a]}`; }
    else if(q.t==='fill'){ b=`<div class="pq"><b>${n}.</b> ${qt}</div>`; a=q.show; }
    else if(q.t==='num'){ b=`<div class="pq"><b>${n}.</b> ${qt}${q.fig?q.fig():''}<div>Απάντηση: ${line(90)} ${esc(q.unit)}</div></div>`; a=fmtNum(q.a)+' '+q.unit+(q.ex?` (${q.ex})`:''); }
    else if(q.t==='match'){ b=`<div class="pq"><b>${n}.</b> ${qt} <span class="note2">Διάλεξε από: ${q.choices.map(esc).join(' · ')}</span><table class="mini">${q.items.map(it=>`<tr><td>${esc(it[0])}</td><td style="width:60%"></td></tr>`).join('')}</table></div>`; a=q.items.map(it=>`${it[0]} → ${it[1]}`).join(' · '); }
    else if(q.t==='order'){ b=`<div class="pq"><b>${n}.</b> ${qt}<div class="note2" style="margin:4px 0">${shuffle(q.items).map(esc).join(' · ')}</div>${line(420)}</div>`; a=q.items.join(' → '); }
    else if(q.t==='acro'){ b=`<div class="pq"><b>${n}.</b> ${qt}${acroGrid(q)}<ol class="pclues">${q.rows.map(r=>`<li>${esc(r.clue)} <span class="note2">(${r.w.length})</span></li>`).join('')}</ol></div>`; a=q.rows.map(r=>r.w).join(', ')+' → <b>'+q.hidden+'</b>'; }
    else if(q.t==='def'){ b=`<div class="pq"><b>${n}.</b> ${qt}<div class="plines"><i></i><i></i></div></div>`; a=q.model; }
    else if(q.t==='cloze'){ b=`<div class="pq"><b>${n}.</b> ${qt}<div class="pbank">${shuffle(q.bank).map(esc).join(' · ')}</div><div>${esc(q.text).replace(/\[\[(\d+)\]\]/g,(m,i)=>`(${+i+1}) ${line(110)}`)}</div></div>`; a=clozeRight(q); }
    body+=head+b; ans+=`<li>${a}</li>`;
  });
  const d=new Date();
  view.innerHTML=`<div class="noprint card stack" style="margin-bottom:12px"><h2>🖨️ ${S.mode==='prova'?'Πρόβα διαγωνίσματος':'Διαγνωστικό'} για εκτύπωση</h2><p>Κάθε φορά που πατάς «Νέο», βγαίνουν άλλες ερωτήσεις και άλλα νούμερα. Οι απαντήσεις είναι στην τελευταία σελίδα.</p>
    <div class="row"><button class="btn" id="pp">Εκτύπωση</button><button class="btn ghost" id="pn">🔀 Νέο διαγώνισμα</button><button class="btn ghost" id="pb">← Πίσω</button></div><p class="hintline">Αν δεν ανοίξει η εκτύπωση, πάτησε Ctrl+P (ή ⌘+P).</p></div>
    <div class="paper"><div class="phead"><b>Φυσικά Ε΄ · Υλικά σώματα · ${S.mode==='prova'?'Διαγώνισμα':'Επανάληψη'}</b><span>Όνομα: ${esc(S.name)} &nbsp; Ημερομηνία: ${d.toLocaleDateString('el-GR')}</span></div>${body}
    <div class="pans"><h3 class="psec">Απαντήσεις (για τον γονιό)</h3><ol>${ans}</ol></div></div>`;
  $('#pp').onclick=()=>{ try{ window.print(); }catch(e){} };
  $('#pn').onclick=renderPrint; $('#pb').onclick=()=>{ renderStart(); };
  window.scrollTo({top:0});
}
/* ======================= ΑΠΟΘΗΚΕΥΣΗ (db) ======================= */
const saveEl=$('#savestate');
function compactAnalysis(A){
  const per={}; Object.keys(A.per).forEach(k=>{ if(A.per[k].total) per[k]={got:+A.per[k].got.toFixed(2),total:A.per[k].total}; });
  return {per, got:+A.got.toFixed(2), total:A.total, pct:A.pct, misconceptions:A.mis.map(m=>({concept:m.c,text:m.text,sure:!!m.sure})), wrong:A.wrong.map(w=>({id:w.id,concept:w.c,question:w.q,given:w.given,right:w.right,conf:w.conf}))};
}
function compactProfile(P){
  return {modes:P.mp, types:P.tp, boxes:{know:P.box.know.map(i=>i.id),fragile:P.box.fragile.map(i=>i.id),belief:P.box.belief.map(i=>i.id),gap:P.box.gap.map(i=>i.id)}, confidence:{sure:P.conf[2],think:P.conf[1],guess:P.conf[0]}, medianSec:P.median, rushed:P.rushed.map(i=>i.id)};
}
function rawAnswers(list, ans){ return list.filter(id=>ans[id]).map(id=>{ const q=byId(id), a=ans[id]; return {id, c:q.c, modes:q.m, type:q.t, score:+a.score.toFixed(2), conf:a.conf, sec:Math.round(a.ms/100)/10, fast:!!a.fast}; }); }
async function saveAttempt(){
  if(!db){ saveEl.textContent=''; return; }
  saveEl.textContent='Αποθήκευση…';
  try{
    const ref=db.collection('attempts').doc();
    const recs=recommendations(S.prof,S.result,S.survey,null).map(r=>r.t+': '+r.d);
    await ref.set(Object.assign({name:S.name, startedAt:new Date(S.started).toISOString(), finishedAt:new Date().toISOString(), ts:Date.now(), quiz:S.mode==='prova'?'ylika-somata-prova':'ylika-somata-v3', mode:S.mode, sections:S.secs||null, survey:S.survey, profile:compactProfile(S.prof), recommendations:recs, answers:rawAnswers(S.list,S.answers)}, compactAnalysis(S.result)));
    S.docId=ref.id; saveEl.textContent='Αποθηκεύτηκε ✓';
  }catch(e){ saveEl.textContent= e&&e.code==='quota_exceeded' ? 'Δεν χωράνε άλλα αποτελέσματα' : 'Δεν αποθηκεύτηκε (χρησιμοποιήστε την «Αντιγραφή αναφοράς»)'; }
}
async function saveReinforce(A){
  if(!db || !S.docId) return;
  try{
    const prev=(await db.collection('attempts').doc(S.docId).get()).data()||{};
    const entry=Object.assign({at:new Date().toISOString(), concepts:S.reinfConcepts, explanations:S.rLog.map(l=>({concept:l.c,first:l.first,viewed:l.viewed,got:l.got,total:l.total})), profile:compactProfile(S.rProf), answers:rawAnswers(S.rList,S.rAnswers)}, compactAnalysis(A));
    const list=(prev.reinforcements||[]).concat([entry]).slice(-10);
    await db.collection('attempts').doc(S.docId).update({reinforcements:list});
    saveEl.textContent='Αποθηκεύτηκε ✓';
  }catch(e){}
}

/* ======================= ΙΣΤΟΡΙΚΟ ======================= */
let hist=[];
function renderParent(){
  const box=$('#parent');
  if(!db || !isEditor){ box.innerHTML=''; return; }
  const rows = hist.length ? hist.map(h=>{ const d=new Date(h.ts); const weak=Object.keys(h.per||{}).filter(k=>h.per[k].total && h.per[k].got/h.per[k].total<.8).map(k=>CONCEPTS[k]?CONCEPTS[k].name:k); const rf=(h.reinforcements||[]).slice(-1)[0];
      const md=h.profile&&h.profile.modes? Object.keys(h.profile.modes).filter(k=>h.profile.modes[k]!==null).sort((a,b)=>h.profile.modes[b]-h.profile.modes[a]) : [];
      return `<tr><td>${esc(h.name||'')}</td><td>${d.toLocaleDateString('el-GR')} ${d.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})}</td><td><b>${h.pct}%</b>${h.mode==='prova'?' <span class="note2">📝 πρόβα</span>':''}</td><td>${weak.length?esc(weak.join(', ')):'—'}</td><td>${md.length?MODES[md[0]].icon+' '+MODES[md[0]].name:'—'}</td><td>${rf?rf.pct+'%':'—'}</td></tr>`; }).join('')
    : '<tr><td colspan="6">Δεν υπάρχουν ακόμα αποτελέσματα. Θα εμφανιστούν εδώ μόλις τελειώσει το πρώτο κουίζ.</td></tr>';
  box.innerHTML = `<details><summary>Ιστορικό προσπαθειών (${hist.length})</summary><div class="tw"><table class="hist"><tr><th>Όνομα</th><th>Ημερομηνία</th><th>Σκορ</th><th>Θέλει ενίσχυση</th><th>Πάει καλύτερα με</th><th>Ενίσχυση</th></tr>${rows}</table></div></details>`;
}
(async function initCaps(){
  if(!window.claude || !window.claude.use) return;
  try{ db = await window.claude.use('db'); }catch(e){ db=null; }
  try{ userCap = await window.claude.use('user'); }catch(e){ userCap=null; }
  if(userCap){ try{ isEditor = !!(await userCap.canEdit()); }catch(e){ isEditor=false; } }
  if(db && isEditor && !attemptsUnsub){
    attemptsUnsub = db.collection('attempts').orderBy('ts','desc').limit(30).onSnapshot(snap=>{ hist=snap.docs.map(d=>d.data()); renderParent(); }, ()=>{});
  }
  renderParent();
})();

renderStart();
})();
</script>
